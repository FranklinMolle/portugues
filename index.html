<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Português">
<meta name="theme-color" content="#0b7a3e">
<title>Aprende Portugués Básico</title>
<style>
  :root {
    --verde: #0b7a3e;
    --verde-claro: #e6f4ec;
    --amarillo: #ffd23f;
    --amarillo-claro: #fff8e1;
    --azul: #1d3c8f;
    --texto: #1f2933;
    --gris: #6b7785;
    --fondo: #f5f7f6;
    --blanco: #fff;
    --error: #c62828;
    --error-claro: #fdecea;
    --casi: #e0a800;
    --casi-claro: #fff6d6;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--verde);
    color: var(--blanco);
    padding: calc(14px + env(safe-area-inset-top)) 18px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  .barra-top { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 1.25rem; margin: 0; flex: 1; }
  .btn-icono {
    background: rgba(255,255,255,.18); color: var(--blanco); border: 0;
    border-radius: 10px; padding: 8px 12px; font-size: .95rem; cursor: pointer;
  }
  .progreso { margin-top: 10px; font-size: .85rem; }
  .barra { background: rgba(255,255,255,.25); border-radius: 99px; height: 8px; margin-top: 5px; overflow: hidden; }
  .barra > div { background: var(--amarillo); height: 100%; transition: width .4s; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }

  .seccion { font-size: 1.05rem; margin: 18px 0 10px; }
  .seccion:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tarjeta-leccion {
    background: var(--blanco); border-radius: var(--radio); padding: 16px 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; position: relative;
    border: 2px solid transparent; transition: transform .1s;
  }
  .tarjeta-leccion:active { transform: scale(.97); }
  .tarjeta-leccion.hecha { border-color: var(--verde); }
  .tarjeta-leccion .ico { font-size: 2rem; }
  .tarjeta-leccion h3 { margin: 6px 0 2px; font-size: 1rem; }
  .tarjeta-leccion small { color: var(--gris); display: block; }
  .insignia {
    position: absolute; top: 10px; right: 10px; background: var(--verde); color: var(--blanco);
    font-size: .75rem; border-radius: 99px; padding: 2px 8px;
  }
  .repaso { background: var(--azul); color: var(--blanco); }
  .repaso small { color: #cfd8f5; }

  .volver { background: none; border: 0; color: var(--verde); font-size: 1rem; padding: 4px 0; cursor: pointer; }
  .intro { background: var(--verde-claro); border-radius: var(--radio); padding: 12px 14px; margin: 10px 0 14px; font-size: .95rem; }
  .pestanas {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
    background: #e3e8e5; padding: 4px; border-radius: 12px; margin-bottom: 14px;
  }
  .pestanas button {
    border: 0; background: none; padding: 7px 2px; border-radius: 9px; cursor: pointer;
    color: var(--texto); font-size: .72rem; display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .pestanas button span { font-size: 1.15rem; }
  .pestanas button.activa { background: var(--blanco); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .fila {
    display: flex; align-items: center; gap: 12px; background: var(--blanco);
    border-radius: 12px; padding: 12px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .fila:active { background: var(--verde-claro); }
  .altavoz {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: var(--verde-claro); font-size: 1.1rem; cursor: pointer;
  }
  .fila .quien { font-size: .78rem; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: .5px; }
  .fila .pt { font-weight: 600; font-size: 1.05rem; }
  .fila .es { color: var(--gris); }
  .pron { font-size: .88rem; color: #8a5a00; font-style: italic; }
  .nota { font-size: .82rem; color: var(--azul); margin-top: 2px; }

  /* Teoría */
  .apunte {
    background: var(--blanco); border-radius: var(--radio); padding: 14px 16px;
    margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .apunte h3 { margin: 0 0 6px; color: var(--verde); font-size: 1.05rem; }
  .apunte p { margin: 6px 0; }
  .apunte ul { margin: 6px 0; padding-left: 20px; }
  .apunte li { margin: 3px 0; }
  .apunte .lista { margin-top: 8px; gap: 6px; }
  .apunte .fila { box-shadow: none; background: var(--fondo); padding: 8px 10px; }
  .apunte .fila .pt { font-size: 1rem; }
  .apunte .altavoz { width: 34px; height: 34px; font-size: .95rem; }
  .etiqueta-extra {
    font-size: .68rem; background: var(--azul); color: var(--blanco); border-radius: 99px;
    padding: 2px 8px; margin-left: 6px; vertical-align: middle; font-weight: 600; white-space: nowrap;
  }
  .porque, .ojo, .consejo { border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: .92rem; }
  .porque { background: var(--amarillo-claro); border-left: 4px solid var(--amarillo); }
  .consejo { background: var(--verde-claro); border-left: 4px solid var(--verde); }
  .consejo ul { margin: 4px 0 0; }
  td .pron { font-size: .85rem; }
  .ojo { background: var(--error-claro); border-left: 4px solid var(--error); }
  .tabla-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 6px 0; }
  th, td { border: 1px solid #dde3e0; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--verde-claro); }
  @media (max-width: 480px) {
    .apunte { padding: 12px 10px; }
    table { font-size: .82rem; }
    th, td { padding: 5px 5px; }
  }

  /* Tarjetas */
  .flash {
    background: var(--blanco); border-radius: 20px; min-height: 230px; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.1); cursor: pointer; user-select: none;
  }
  .flash .grande { font-size: 1.8rem; font-weight: 700; }
  .flash .ayuda { color: var(--gris); font-size: .85rem; margin-top: 14px; }
  .flash.volteada { background: var(--verde-claro); }
  .controles { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
  .controles.izq { justify-content: flex-start; margin-top: 10px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 18px; font-size: 1rem; cursor: pointer;
    background: var(--verde); color: var(--blanco); font-weight: 600;
  }
  .btn.sec { background: #e3e8e5; color: var(--texto); }
  .btn.peq { padding: 8px 14px; font-size: .9rem; }
  .contador { text-align: center; color: var(--gris); margin-top: 10px; font-size: .9rem; }

  /* Ejercicios */
  .marcador {
    background: var(--azul); color: var(--blanco); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px; font-size: .92rem;
  }
  .ej { background: var(--blanco); border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .ej .tipo { font-size: .8rem; color: var(--gris); margin-bottom: 4px; }
  .ej .frase { font-size: 1.1rem; line-height: 2.1; }
  .ej .trad { font-size: .85rem; color: var(--gris); }
  .ej .opciones { margin-top: 8px; }
  .hueco-txt { color: var(--verde); font-weight: 700; letter-spacing: 1px; }
  input.hueco {
    font-size: 16px; font-family: inherit; color: var(--texto); text-align: center;
    border: 0; border-bottom: 2px solid var(--verde); background: var(--verde-claro);
    border-radius: 6px 6px 0 0; padding: 3px 6px; margin: 0 3px; max-width: 100%;
  }
  input.hueco:disabled { opacity: 1; -webkit-text-fill-color: var(--texto); }
  input.hueco.bien { background: #c8ecd6; }
  input.hueco.mal { border-color: var(--error); background: var(--error-claro); }
  input.hueco.casi { border-color: var(--casi); background: var(--casi-claro); }
  .res { margin-top: 8px; font-size: .95rem; }
  .res .explica { color: var(--azul); font-size: .88rem; margin-top: 4px; }
  .res .aviso { color: var(--casi); }

  /* Quiz */
  .pregunta { background: var(--blanco); border-radius: var(--radio); padding: 18px; text-align: center; margin-bottom: 12px; }
  .pregunta .tipo { color: var(--gris); font-size: .85rem; }
  .pregunta .grande { font-size: 1.5rem; font-weight: 700; margin: 6px 0; }
  .opciones { display: flex; flex-direction: column; gap: 8px; }
  .opcion {
    background: var(--blanco); border: 2px solid #dde3e0; border-radius: 12px; padding: 14px;
    font-size: 1rem; text-align: left; cursor: pointer; color: var(--texto);
  }
  .opcion:disabled { opacity: 1; color: var(--texto); cursor: default; }
  .opcion.bien { border-color: var(--verde); background: var(--verde-claro); }
  .opcion.mal { border-color: var(--error); background: var(--error-claro); }
  .resultado { text-align: center; background: var(--blanco); border-radius: var(--radio); padding: 26px 18px; }
  .resultado .pct { font-size: 3rem; font-weight: 800; color: var(--verde); }
  footer { text-align: center; color: var(--gris); font-size: .8rem; margin-top: 30px; }
</style>
</head>
<body>
<header>
  <div class="barra-top">
    <h1>🇧🇷 Aprende Portugués</h1>
    <button class="btn-icono" id="btnVelocidad" onclick="cambiarVelocidad()">🐇 Normal</button>
  </div>
  <div class="progreso">
    <span id="txtProgreso"></span>
    <div class="barra"><div id="barraProgreso" style="width:0"></div></div>
  </div>
</header>
<main id="app"></main>

<script>
// ---------------------------------------------------------------
// CONTENIDO
// Cada lección tiene:
//   grupo:      "curso" (de mis clases) o "extra" (práctica adicional)
//   apuntes:    bloques de teoría {t, p, tabla: {cab, filas}, lista, ej: [[pt, es]], dialogo: [[quién, pt, es]],
//               porque, ojo, extra: true}   ·  **negrita**  *cursiva*
//   items:      vocabulario {pt, es, n}  (n = nota opcional)
//   ejercicios: {tipo: "completar", frase: "Eu ___ estudante.", resp: ["sou"], pista, trad, explica}
//               {tipo: "marcar", frase: "...", opciones: [...], resp: índice (desde 0), explica, oir}
//               En "completar", cada ___ es un hueco y resp lleva una respuesta por hueco
//               (o una lista de respuestas válidas: [["bem", "bom"]]).
// ---------------------------------------------------------------
const LECCIONES = [
  // =============================== MI CURSO ===============================
  {
    id: "alfabeto", grupo: "curso", icono: "🔤", titulo: "Alfabeto y pronunciación",
    intro: "Antes de hablar hay que reconocer los sonidos. El portugués de Brasil se escribe parecido al español, pero varias letras suenan distinto.",
    apuntes: [
      { t: "Cómo leer la pronunciación 🗣️", extra: true,
        p: "En toda la página, debajo de cada palabra en portugués verás cómo se pronuncia, escrito para que lo leas como en español:",
        tabla: { cab: ["Si ves...", "Pronúncialo como...", "Ejemplo"], filas: [
          ["**zh**", "la *j* del francés o la *y* argentina", "janela → *zhanéla*"],
          ["**sh**", "la *sh* del inglés (*show*)", "chave → *shávi*"],
          ["**j**", "una *j* suave, casi aspirada", "Rio → *Jíu*"],
          ["**dyi** / **chi**", "*de, di* / *te, ti* del portugués", "cidade → *sidádyi*, leite → *léichi*"],
          ["**lli** / **ñ**", "*lh* / *nh*", "filho → *fílliu*, vinho → *víñu*"],
          ["**aun, ain, oin, ein**", "vocales nasales (el aire sale también por la nariz)", "não → *naun*, homem → *ómein*"],
          ["**z**", "una *s* que zumba (como una abeja)", "casa → *káza*"],
          ["tilde (á, é...)", "la sílaba que suena más fuerte", "obrigado → *obrigádu*"]] },
        porque: "Es una **aproximación** para ayudarte a leer: la referencia real es el audio 🔊. Escucha siempre y repite." },
      { t: "O alfabeto",
        p: "Tiene 26 letras, como el español, pero **sin la ñ** (se escribe **nh**). Así se llaman las letras:",
        tabla: { cab: ["Letra", "Nombre", "Letra", "Nombre"], filas: [
          ["A", "á", "N", "êni"], ["B", "bê", "O", "ó"], ["C", "cê", "P", "pê"], ["D", "dê", "Q", "quê"],
          ["E", "é", "R", "érre (éje)"], ["F", "éfi", "S", "ési"], ["G", "gê", "T", "tê"], ["H", "agá", "U", "u"],
          ["I", "i", "V", "vê"], ["J", "jóta", "W", "dáblio"], ["K", "cá", "X", "xis"], ["L", "éli", "Y", "ípsilon"],
          ["M", "êmi", "Z", "zê"], ["", "", "", ""]] },
        ej: [["Como se escreve o seu nome?", "¿Cómo se escribe tu nombre?"], ["agá", "H"], ["jota", "J"], ["dáblio", "W"], ["xis", "X"], ["ípsilon", "Y"]],
        porque: "Sirve para **deletrear** tu nombre, apellido o correo. En Brasil te lo van a preguntar mucho: *Como se escreve?* (¿Cómo se escribe?)." },
      { t: "Fonética: los sonidos peculiares",
        p: "Estos son los sonidos que más cambian respecto al español:",
        tabla: { cab: ["Se escribe", "Suena como", "Ejemplo"], filas: [
          ["j, ge, gi", "**zh** (la j del francés)", "**J**úlio é um jovem **gi**gante."],
          ["de, di", "**dyi** (como *yi*)", "Bom **di**a, Cláu**di**a."],
          ["r inicial, rr", "**j** suave", "O **R**ei; o ca**rr**o"],
          ["te, ti", "**chi**", "O lei**te** está quen**te**."],
          ["ch, x", "**sh** del inglés", "Ela toma **ch**á na **x**ícara."],
          ["lh", "**lli** (una 'li' rápida)", "O mo**lh**o fica me**lh**or com a**lh**o."],
          ["ce, ci, s, ss, ç", "**s**", "A**ç**úcar ou ado**ç**ante?"],
          ["nh", "**ñ**", "Eu so**nh**ei com a Nicole."],
          ["z, s entre vocales", "**z** zumbada", "Teresa tem uma bele**z**a de ca**s**a."],
          ["v", "**v** (dientes sobre el labio)", "**V**amos **v**iajar."]] },
        ej: [["Júlio é um jovem gigante.", "Julio es un joven gigante."], ["Bom dia, Cláudia.", "Buen día, Claudia."],
             ["A verdade dói.", "La verdad duele."], ["O carro daquele cara é caro.", "El auto de ese tipo es caro."],
             ["O leite está quente.", "La leche está caliente."], ["Acho que vai chover.", "Creo que va a llover."],
             ["O molho fica melhor com alho.", "La salsa queda mejor con ajo."], ["Não tenho dinheiro nenhum.", "No tengo nada de dinero."],
             ["Vamos viajar para Nova Iorque.", "Vamos a viajar a Nueva York."]],
        porque: "En español la **b** y la **v** suenan igual, pero en portugués **no**: la v vibra con los dientes sobre el labio inferior. Por eso *vinho* y *bom* empiezan distinto." },
      { t: "El uso de la Ç (cedilha)",
        p: "La **ç** solo va antes de **a, o, u**, y hace que la c suene **/s/** en vez de **/k/**:",
        ej: [["cabeça", "cabeza"], ["pescoço", "cuello"], ["açúcar", "azúcar"], ["coração", "corazón"]],
        porque: "Sin cedilla, **ca, co, cu** suenan *ka, ko, ku*. Antes de **e, i** no hace falta porque la c ya suena s (*cidade, cebola*). Por eso **nunca** verás *çe* ni *çi*." },
      { t: "Sonidos nasales",
        p: "La **~** (til) y las terminaciones **-am, -em** hacen que el aire salga también por la nariz:",
        tabla: { cab: ["Escritura", "Ejemplos"], filas: [
          ["ão, -am", "mão, São Paulo, foram, falam"], ["ãe, ães", "mãe, pães"], ["õe, ões", "põe, limões, canções"],
          ["-em, -ens", "jovem, também, homem"], ["ui", "muito (suena *muinto*)"]] },
        ej: [["A mãe não está.", "La madre no está."], ["Põe mais três limões verdes.", "Pon tres limones verdes más."],
             ["Ele é um homem de bem.", "Él es un hombre de bien."], ["São amigos do coração.", "Son amigos del alma."]],
        consejos: ["En **homem** la *h* no suena y el final **-em** es nasal: *ómein*. Lo mismo en *também* (*tambéin*) y *jovem* (*zhóvein*).",
                   "La **h** al inicio nunca suena: *hoje* → *ózhi*, *hora* → *óra*."],
        porque: "Muchos verbos en plural terminan en **-am** (eles falam, eles gostam) y suenan nasales, como *fálaun*. Si los pronuncias con una m normal, cuesta entenderte." },
      { t: "La O: cerrada, abierta y débil",
        tabla: { cab: ["Sonido", "Ejemplo"], filas: [
          ["**ô** cerrada", "Meu av**ô** morreu novo. (abuelo)"], ["**ó** abierta", "Minha av**ó** não tomava sol. (abuela)"],
          ["o final débil → **u**", "O sapat**o** d**o** Manuel. (*sapatu du*)"], ["om, on nasal", "**On**tem o s**om** estava b**om**."]] },
        porque: "El acento cambia el significado: **avô** (abuelo) y **avó** (abuela) solo se diferencian en si la o es cerrada o abierta." }
    ],
    items: [
      { pt: "não", es: "no", n: "ão nasal: 'naun'" }, { pt: "mãe", es: "madre", n: "ãe nasal" },
      { pt: "mão", es: "mano" }, { pt: "filho", es: "hijo", n: "lh = 'li' rápida" },
      { pt: "vinho", es: "vino", n: "nh = ñ" }, { pt: "coração", es: "corazón", n: "ç = s" },
      { pt: "cabeça", es: "cabeza" }, { pt: "pescoço", es: "cuello" }, { pt: "açúcar", es: "azúcar" },
      { pt: "chave", es: "llave", n: "ch = sh" }, { pt: "xícara", es: "taza", n: "x = sh" },
      { pt: "janela", es: "ventana", n: "j = zh" }, { pt: "leite", es: "leche", n: "te = chi" },
      { pt: "dia", es: "día", n: "di = dyi" }, { pt: "carro", es: "auto / carro", n: "rr = j suave" },
      { pt: "alho", es: "ajo" }, { pt: "muito", es: "mucho", n: "suena 'muinto'" },
      { pt: "avô", es: "abuelo", n: "ô cerrada" }, { pt: "avó", es: "abuela", n: "ó abierta" }
    ],
    ejercicios: [
      { tipo: "marcar", frase: "¿Cómo se llama la letra **H**?", opciones: ["agá", "ache", "rê"], resp: 0, oir: "agá" },
      { tipo: "marcar", frase: "La letra **X** se llama:", opciones: ["equis", "xis", "shi"], resp: 1, oir: "xis" },
      { tipo: "marcar", frase: "La letra **J** se llama:", opciones: ["jóta", "gê", "ji"], resp: 0, oir: "jota" },
      { tipo: "marcar", frase: "En *dia*, la **d** suena:", opciones: ["d", "dyi (yi)", "t"], resp: 1, oir: "dia" },
      { tipo: "marcar", frase: "En *quente*, el **te** final suena:", opciones: ["te", "ti", "chi"], resp: 2, oir: "quente" },
      { tipo: "marcar", frase: "En *chá* y *xícara*, la **ch** y la **x** suenan:", opciones: ["ch de chocolate", "sh del inglés", "k"], resp: 1, oir: "chá, xícara" },
      { tipo: "marcar", frase: "La **rr** de *carro* suena como:", opciones: ["r fuerte del español", "j suave"], resp: 1, oir: "carro" },
      { tipo: "marcar", frase: "¿Cuál está bien escrita?", opciones: ["cabeça", "cabeca", "cabesa"], resp: 0,
        explica: "La **ç** hace que la c suene s antes de **a**." },
      { tipo: "marcar", frase: "¿Cuál está bien escrita?", opciones: ["çidade", "cidade"], resp: 1,
        explica: "Antes de **e, i** la c ya suena s: nunca se escribe *çe* ni *çi*." },
      { tipo: "marcar", frase: "*muito* se pronuncia:", opciones: ["muito (tal cual)", "muinto (nasal)"], resp: 1, oir: "muito" },
      { tipo: "completar", frase: "___", resp: ["coração"], pista: "Escribe 'corazón' en portugués" },
      { tipo: "completar", frase: "___", resp: ["açúcar"], pista: "Escribe 'azúcar' en portugués" },
      { tipo: "completar", frase: "___", resp: ["mão"], pista: "Escribe 'mano' en portugués" },
      { tipo: "completar", frase: "Minha ___ não tomava sol.", resp: ["avó"], pista: "abuela (o abierta)" },
      { tipo: "completar", frase: "Meu ___ morreu novo.", resp: ["avô"], pista: "abuelo (o cerrada)" }
    ]
  },
  {
    id: "saludos", grupo: "curso", icono: "👋", titulo: "Saludos (Cumprimentos)",

// ---------- guía de pronunciación (portugués de Brasil, escrita para hispanohablantes) ----------
// zh = j francesa · sh = sh inglesa · j = j suave · ñ = nh · lli = lh · dyi / chi = de, di / te, ti
// aun, ain, oin, ein = nasales · la tilde marca la sílaba fuerte
const PRON_EXCEPCIONES = {
  muito: "múintu", muita: "múinta", muitos: "múintus", muitas: "múintas", ainda: "aínda", sexta: "sésta", ao: "au",
  robert: "jóberchi", brighton: "bráitun", callao: "caiáu", luiz: "luís", werner: "vérner", martinelli: "marchinéli"
};
const VOCALES = "aáâãàeéêiíoóôõuú";
const CON_ACENTO = /[áéíóúâêô]/;
function pronPalabra(palabra) {
  const s = palabra.toLowerCase(), n = s.length;
  let r = PRON_EXCEPCIONES[s];
  if (!r) {
    const esVocal = i => i >= 0 && i < n && VOCALES.includes(s[i]);
    const uMuda = i => s[i] === "u" && (s[i - 1] === "q" || s[i - 1] === "g") && esVocal(i + 1);
    const vocal = i => esVocal(i) && !uMuda(i);
    // Núcleos de sílaba (vocal o diptongo)
    const nucleos = [];
    for (let i = 0; i < n;) {
      if (!vocal(i)) { i++; continue; }
      let j = i + 1;
      const par = s.slice(i, i + 2);
      if (["ão", "ãe", "õe"].includes(par)) j = i + 2;
      else if ("aáâeéêoóô".includes(s[i]) && /^[iu]$/.test(s[i + 1] || "")) j = i + 2;
      else if (par === "ui" || par === "iu") j = i + 2;
      nucleos.push({ a: i, b: j });
      i = j;
    }
    // Sílaba tónica
    let t = nucleos.findIndex(x => CON_ACENTO.test(s.slice(x.a, x.b)));
    if (t < 0) t = nucleos.findIndex(x => /[ãõ]/.test(s.slice(x.a, x.b)));
    if (t < 0) {
      const sinS = s.replace(/s$/, "");
      const llana = /[aeo]$/.test(sinS) || /(am|em|en)$/.test(sinS);
      t = nucleos.length >= 2 && llana ? nucleos.length - 2 : nucleos.length - 1;
    }
    const mono = nucleos.length === 1;
    const marcar = !mono || CON_ACENTO.test(s);
    const tildar = v => v.replace(/[aeiou]/, c => ({ a: "á", e: "é", i: "í", o: "ó", u: "ú" }[c]));
    // Cómo suena cada vocal
    const sale = {};
    nucleos.forEach((x, k) => {
      const txt = s.slice(x.a, x.b).replace("à", "a");
      const resto = s.slice(x.b);
      const ultima = k === nucleos.length - 1;
      let v;
      if (txt === "ão") v = "aun";
      else if (txt === "ãe") v = "ain";
      else if (txt === "õe") v = "oin";
      else if (txt === "ã") v = "an";
      else if (txt === "õ") v = "on";
      else if (ultima && resto === "m") {
        v = { a: "aun", e: "ein", i: "in", o: "on", u: "un" }[sinTildes(txt[0])] || txt;
        if (CON_ACENTO.test(txt[0])) v = txt[0] + v.slice(1);
        sale[x.b] = "";
      } else if (ultima && resto === "ns" && sinTildes(txt) === "e") {
        v = CON_ACENTO.test(txt) ? txt + "in" : "ein";
        sale[x.b] = "";
      } else if (ultima && /^s?$/.test(resto) && /^[eo]$/.test(txt) && (k !== t || (mono && !CON_ACENTO.test(s)))) {
        v = txt === "e" ? "i" : "u";
      } else v = txt;
      if (k === t && marcar && !CON_ACENTO.test(v)) v = tildar(v);
      sale[x.a] = v;
      for (let i = x.a + 1; i < x.b; i++) sale[i] = "";
    });
    const suenaI = i => /^[ií]/.test(sale[i + 1] || "");
    const eI = c => /[eéêií]/.test(c || "");
    r = "";
    for (let i = 0; i < n; i++) {
      if (i in sale) { r += sale[i]; continue; }
      const c = s[i], sig = s[i + 1], ant = s[i - 1];
      if (c === "h") continue;                                       // la h no suena
      else if (c === "c") { if (sig === "h") { r += "sh"; i++; } else r += eI(sig) ? "s" : "c"; }
      else if (c === "ç") r += "s";
      else if (c === "q") { if (sig === "u") { r += eI(s[i + 2]) ? "qu" : "cu"; i++; } else r += "c"; }
      else if (c === "g") { if (uMuda(i + 1)) { r += "gu"; i++; } else r += eI(sig) ? "zh" : "g"; }
      else if (c === "j") r += "zh";
      else if (c === "l") {
        if (sig === "h") { r += suenaI(i + 1) ? "ll" : "lli"; i++; }
        else if (!vocal(i + 1)) r += /[uú]$/.test(r) ? "" : "u";    // l final suena u: Brasil → brazíu
        else r += "l";
      }
      else if (c === "n") { if (sig === "h") { r += "ñ"; i++; } else r += "n"; }
      else if (c === "r") { if (i === 0 || "nls".includes(ant)) r += "j"; else if (sig === "r") { r += "j"; i++; } else r += "r"; }
      else if (c === "s") { if (sig === "s") { r += "s"; i++; } else r += vocal(i - 1) && vocal(i + 1) ? "z" : "s"; }
      else if (c === "x") r += i === 1 && s[0] === "e" && vocal(2) ? "z" : "sh";
      else if (c === "z") r += i === n - 1 ? "s" : "z";
      else if (c === "t") { if (sig === "c" && s[i + 2] === "h") { r += "ch"; i += 2; } else r += suenaI(i) ? "ch" : "t"; }
      else if (c === "d") r += suenaI(i) ? "dy" : "d";
      else if (c === "y") r += "i";
      else if (c === "w") r += "u";
      else r += c;
    }
  }
  return palabra[0] !== palabra[0].toLowerCase() ? r[0].toUpperCase() + r.slice(1) : r;
}
const pron = texto => sinMd(texto).replace(/[A-Za-zÀ-ÿ]+/g, pronPalabra);

// ---------- voz ----------
function vozPortugues() {
  const voces = speechSynthesis.getVoices();
  return voces.find(v => v.lang === "pt-BR" || v.lang === "pt_BR") ||
         voces.find(v => v.lang.startsWith("pt"));
}
function hablar(texto) {
  if (!("speechSynthesis" in window)) { alert("Tu navegador no permite reproducir voz."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto.replace(/\.\.\./g, ""));
  u.lang = "pt-BR";
  const v = vozPortugues();
  if (v) u.voice = v;
  u.rate = velocidadLenta ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

function cambiarVelocidad() {
  velocidadLenta = !velocidadLenta;
  localStorage.setItem("pt-lento", velocidadLenta ? "1" : "0");
  pintarVelocidad();
}
function pintarVelocidad() {
  document.getElementById("btnVelocidad").textContent = velocidadLenta ? "🐢 Lento" : "🐇 Normal";
}

function guardarNota(id, pct) {
  if (pct > (progreso[id] || 0)) {
    progreso[id] = pct;
    localStorage.setItem(CLAVE, JSON.stringify(progreso));
  }
  pintarProgreso();
}

  const hechas = LECCIONES.filter(l => (progreso[l.id] || 0) >= APROBADO).length;
  document.getElementById("txtProgreso").textContent = `Lecciones completadas: ${hechas} de ${LECCIONES.length}`;
  document.getElementById("barraProgreso").style.width = (hechas / LECCIONES.length * 100) + "%";
}

// ---------- navegación ----------
// Rutas: #/  ·  #/l/<lección>  ·  #/l/<lección>/<pestaña>
function ruta() {
  const m = location.hash.match(/^#\/l\/(\w+)(?:\/(\w+))?/);
  if (m) {
    leccion = m[1] === "repaso"
      ? { id: "repaso", icono: "🏆", titulo: "Repaso general",
          intro: "Vocabulario, ejercicios y quiz mezclados de todas las lecciones.",
          items: LECCIONES.flatMap(l => l.items),
          ejercicios: mezclar(LECCIONES.flatMap(l => l.ejercicios || [])).slice(0, 15) }
      : LECCIONES.find(l => l.id === m[1]);
    if (leccion) {
      const disponibles = pestanasDe(leccion).map(p => p.id);
      pestana = disponibles.includes(m[2]) ? m[2] : (leccion.id === "repaso" ? "quiz" : disponibles[0]);
      prepararPestana();
      pintarLeccion();
      window.scrollTo(0, 0);
      return;
    }
  }
  leccion = null;
  pintarInicio();
}
window.addEventListener("hashchange", ruta);

function pestanasDe(l) { return PESTANAS.filter(p => p.hay(l)); }
function prepararPestana() {
  if (pestana === "tarjetas") { mazo = leccion.items.map((_, i) => i); tarjetaIdx = 0; volteada = false; }
  if (pestana === "quiz") quiz = crearQuiz(leccion.items);
  if (pestana === "ejercicios") ejRes = leccion.ejercicios.map(() => null);
}
function cambiarPestana(p) {
  pestana = p;
  history.replaceState(null, "", `#/l/${leccion.id}/${p}`);
  prepararPestana();
  pintarLeccion();
  window.scrollTo(0, 0);
}

function tarjetaLeccion(l) {
  const nota = progreso[l.id] || 0;

  return `
    <div class="tarjeta-leccion ${hecha ? "hecha" : ""}" onclick="location.hash='#/l/${l.id}'">
      ${nota ? `<span class="insignia">${hecha ? "✓ " : ""}${nota}%</span>` : ""}
      <div class="ico">${l.icono}</div>
      <h3>${esc(l.titulo)}</h3>
      <small>${l.items.length} palabras · ${(l.ejercicios || []).length} ejercicios</small>
      ${notaEj !== undefined ? `<small>✏️ Ejercicios: ${notaEj}%</small>` : ""}
    </div>`;
}
function pintarInicio() {
  const notaRepaso = progreso.repaso || 0;
  $app.innerHTML = `
    <h2 class="seccion">📘 Mi curso</h2>
    <div class="grid">${LECCIONES.filter(l => l.grupo === "curso").map(tarjetaLeccion).join("")}</div>

}

  $app.innerHTML = `
    <button class="volver" onclick="location.hash='#/'">← Lecciones</button>
    <h2 style="margin:6px 0 0">${leccion.icono} ${esc(leccion.titulo)}</h2>
    <div class="intro">${esc(leccion.intro)}</div>
    ${barra}
    ${cuerpo}`;
}

// Teoría
function htmlApuntes() {
  // t.pron = columnas a las que se les agrega al lado una columna de pronunciación
  const tabla = t => {
    const expandir = (fila, celda) => fila.flatMap((c, k) => t.pron && t.pron.includes(k) ? [md(c), celda(c)] : [md(c)]);
    return `
    <div class="tabla-wrap"><table>
      ${t.cab.some(c => c) ? `<tr>${expandir(t.cab, () => "🗣️").map(c => `<th>${c}</th>`).join("")}</tr>` : ""}
      ${t.filas.map(f => `<tr>${expandir(f, c => c ? `<span class="pron">${esc(pron(c))}</span>` : "").map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
  };
  return leccion.apuntes.map(a => `
    <div class="apunte">
      ${a.t ? `<h3>${esc(a.t)}${a.extra ? `<span class="etiqueta-extra">➕ Extra</span>` : ""}</h3>` : ""}
      ${a.p ? `<p>${md(a.p)}</p>` : ""}
      ${a.tabla ? tabla(a.tabla) : ""}
      ${a.lista ? `<ul>${a.lista.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : ""}
      ${a.ej ? `<div class="lista">${a.ej.map(([pt, es, pr]) => filaAudio(pt, es, null, null, pr)).join("")}</div>` : ""}
      ${a.dialogo ? `<div class="lista">${a.dialogo.map(([quien, pt, es, pr]) => filaAudio(pt, es, null, quien, pr)).join("")}</div>` : ""}
      ${a.consejos ? `<div class="consejo">💡 <strong>Consejos</strong><ul>${a.consejos.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : ""}
      ${a.porque ? `<div class="porque">🤔 <strong>¿Por qué?</strong> ${md(a.porque)}</div>` : ""}
      ${a.ojo ? `<div class="ojo">⚠️ <strong>Ojo:</strong> ${md(a.ojo)}</div>` : ""}
    </div>`).join("") + siguientePaso("ejercicios", "Practicar con ejercicios →");
}

// Vocabulario
function htmlAprender() {
  return `<div class="lista">${leccion.items.map(it => filaAudio(it.pt, it.es, it.n, null, it.pr)).join("")}</div>` +
    siguientePaso("ejercicios", "Hacer los ejercicios →");
}
function siguientePaso(p, texto) {
  if (!pestanasDe(leccion).some(x => x.id === p)) return "";
  return `<div class="controles"><button class="btn" onclick="cambiarPestana('${p}')">${texto}</button></div>`;
}

// Tarjetas
function htmlTarjetas() {
  const it = leccion.items[mazo[tarjetaIdx]];
  return `
    <div class="flash ${volteada ? "volteada" : ""}" onclick="voltear()">
      <div class="grande">${esc(volteada ? it.es : it.pt)}</div>
      ${volteada ? "" : `<div class="pron" style="margin-top:6px">🗣️ ${esc(it.pr || pron(it.pt))}</div>`}
      ${volteada && it.n ? `<div class="nota" style="margin-top:8px">💡 ${esc(it.n)}</div>` : ""}
      <div class="ayuda">${volteada ? "Toca para ver en portugués" : "¿Qué significa? Toca para voltear"}</div>
    </div>
    <div class="contador">${tarjetaIdx + 1} / ${mazo.length}</div>
    <div class="controles">
      <button class="btn sec" onclick="moverTarjeta(-1)">◀</button>
      <button class="btn sec" onclick="hablar(leccion.items[mazo[tarjetaIdx]].pt)">🔊 Escuchar</button>
      <button class="btn sec" onclick="mezclar(mazo);tarjetaIdx=0;volteada=false;pintarLeccion()">🔀</button>
      <button class="btn" onclick="moverTarjeta(1)">▶</button>
    </div>`;
}
function voltear() { volteada = !volteada; pintarLeccion(); }
function moverTarjeta(d) {
  tarjetaIdx = (tarjetaIdx + d + mazo.length) % mazo.length;
  volteada = false;
  pintarLeccion();
}

// Ejercicios
function htmlEjercicios() {
  return `
    <div class="marcador" id="ejMarcador">${textoMarcador()}</div>
    <div class="lista">
      ${leccion.ejercicios.map((e, i) => e.tipo === "marcar" ? htmlMarcar(e, i) : htmlCompletar(e, i)).join("")}
    </div>
    <div class="controles"><button class="btn sec" onclick="cambiarPestana('ejercicios')">↺ Reiniciar ejercicios</button></div>`;
}
function htmlCompletar(e, i) {
  const partes = e.frase.split("___");
  let frase = esc(partes[0]);
  for (let k = 1; k < partes.length; k++) {
    const largo = Math.max(...[].concat(e.resp[k - 1]).map(s => s.length));
    frase += `<input class="hueco" style="width:${Math.max(5, largo + 2)}ch" autocomplete="off" autocapitalize="off"
      autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')comprobarCompletar(${i})">` + esc(partes[k]);
  }
  return `
    <div class="ej" id="ej-${i}">
      <div class="tipo">✏️ Completa${e.pista ? ` · <em>${esc(e.pista)}</em>` : ""}</div>
      <div class="frase">${frase}</div>
      ${e.trad ? `<div class="trad">${esc(e.trad)}</div>` : ""}
      <div class="controles izq"><button class="btn peq" onclick="comprobarCompletar(${i})">Comprobar</button></div>
      <div class="res"></div>
    </div>`;
}
function htmlMarcar(e, i) {
  return `
    <div class="ej" id="ej-${i}">
      <div class="tipo">☑️ Marca la correcta</div>
      <div class="frase">${md(e.frase)}</div>
      <div class="opciones">
        ${e.opciones.map((o, k) => `<button class="opcion" onclick="marcar(${i}, ${k})">${esc(o)}</button>`).join("")}
      </div>
      <div class="res"></div>
    </div>`;
}
function fraseCompleta(e) {
  return e.frase.split("___").reduce((acc, parte, k) => acc + [].concat(e.resp[k - 1])[0] + parte);
}
function comprobarCompletar(i) {
  if (ejRes[i] !== null) return;
  const e = leccion.ejercicios[i];
  const caja = document.getElementById("ej-" + i);
  const inputs = [...caja.querySelectorAll("input")];
  const res = caja.querySelector(".res");
  if (inputs.some(inp => !inp.value.trim())) {
    res.innerHTML = `<span class="aviso">Completa todos los espacios primero.</span>`;
    return;
  }
  let todoBien = true, casi = false;
  inputs.forEach((inp, k) => {
    const validas = [].concat(e.resp[k]).map(normalizar);
    const v = normalizar(inp.value);
    const exacta = validas.includes(v);
    const soloTildes = !exacta && validas.some(a => sinTildes(a) === sinTildes(v));
    inp.classList.add(exacta ? "bien" : soloTildes ? "casi" : "mal");
    inp.disabled = true;
    if (!exacta) todoBien = false;
    if (soloTildes) casi = true;
  });
  const correcta = fraseCompleta(e);
  let msg = todoBien ? "✅ ¡Correcto!"
          : casi ? `🟡 ¡Casi! Revisa las tildes: <strong>${esc(correcta)}</strong>`
          : `❌ Respuesta: <strong>${esc(correcta)}</strong>`;
  msg += `<div class="pron">🗣️ ${esc(pron(correcta))}</div>`;
  if (e.explica) msg += `<div class="explica">💡 ${md(e.explica)}</div>`;
  res.innerHTML = msg;
  caja.querySelector(".controles").remove();
  hablar(correcta.replace(/ · /g, ", "));
  terminarEjercicio(i, todoBien);
}
function marcar(i, k) {
  if (ejRes[i] !== null) return;
  const e = leccion.ejercicios[i];
  const caja = document.getElementById("ej-" + i);
  const ok = k === e.resp;
  caja.querySelectorAll(".opcion").forEach((b, j) => {
    if (j === e.resp) b.classList.add("bien");
    else if (j === k) b.classList.add("mal");
    b.disabled = true;
  });
  const oir = e.oir || (e.frase.includes("___") ? e.frase.replace("___", e.opciones[e.resp]) : null);
  let msg = ok ? "✅ ¡Correcto!" : `❌ La correcta es: <strong>${esc(e.opciones[e.resp])}</strong>`;
  if (oir) msg += `<div class="pron">🗣️ ${esc(pron(oir))}</div>`;
  if (e.explica) msg += `<div class="explica">💡 ${md(e.explica)}</div>`;
  caja.querySelector(".res").innerHTML = msg;
  if (oir) hablar(oir);
  terminarEjercicio(i, ok);
}
function terminarEjercicio(i, ok) {
  ejRes[i] = ok;
  document.getElementById("ejMarcador").innerHTML = textoMarcador();
  if (ejRes.every(r => r !== null)) {
    guardarNota("ej-" + leccion.id, Math.round(ejRes.filter(Boolean).length / ejRes.length * 100));
  }
}
function textoMarcador() {
  const hechos = ejRes.filter(r => r !== null).length;
  const bien = ejRes.filter(r => r === true).length;
  if (hechos === ejRes.length && hechos > 0) {
    const pct = Math.round(bien / hechos * 100);
    return `🎉 ¡Terminaste! ${bien} de ${hechos} correctos (${pct}%)` +
      (pct < 100 ? " · Repasa la teoría y vuelve a intentarlo" : " · Perfeito!");
  }
  return `Respondidos: ${hechos} de ${ejRes.length} · Correctos: ${bien}`;
}

// Quiz
function crearQuiz(items) {
  const elegidos = mezclar(items.slice()).slice(0, Math.min(10, items.length));
  const preguntas = elegidos.map(it => {
    const desdePt = Math.random() < 0.5;
    const campo = desdePt ? "es" : "pt";
    const correcta = it[campo];
    const otras = [...new Set(items.map(x => x[campo]).filter(x => x !== correcta))];
    return {
      it, desdePt, correcta,
      opciones: mezclar([correcta, ...mezclar(otras).slice(0, 3)])
    };
  });
  return { preguntas, i: 0, aciertos: 0, elegida: null };
}
function htmlQuiz() {
  const q = quiz;
  if (q.i >= q.preguntas.length) {
    const pct = Math.round(q.aciertos / q.preguntas.length * 100);
    guardarNota(leccion.id, pct);
    const msg = pct === 100 ? "¡Perfeito! 🎉" : pct >= APROBADO ? "Muito bem! 👏 Lección completada" : "Quase lá… ¡inténtalo otra vez! 💪";
    return `
      <div class="resultado">
        <div class="pct">${pct}%</div>
        <p>${q.aciertos} de ${q.preguntas.length} correctas</p>
        <p><strong>${msg}</strong></p>
        <div class="controles">
          <button class="btn sec" onclick="location.hash='#/'">Lecciones</button>
          <button class="btn" onclick="cambiarPestana('quiz')">Repetir quiz</button>
        </div>
      </div>`;
  }
  const p = q.preguntas[q.i];
  const pregunta = p.desdePt ? p.it.pt : p.it.es;
  const opciones = p.opciones.map((op, k) => {
    let clase = "";
    if (q.elegida !== null) {
      if (op === p.correcta) clase = "bien";
      else if (k === q.elegida) clase = "mal";
    }
    return `<button class="opcion ${clase}" onclick="responder(${k})">${esc(op)}</button>`;
  }).join("");
  return `
    <div class="contador" style="margin:0 0 8px">Pregunta ${q.i + 1} de ${q.preguntas.length} · Aciertos: ${q.aciertos}</div>
    <div class="pregunta">
      <div class="tipo">${p.desdePt ? "¿Qué significa en español?" : "¿Cómo se dice en portugués?"}</div>
      <div class="grande">${esc(pregunta)}</div>
      ${p.desdePt ? `<button class="altavoz" onclick="hablar(quiz.preguntas[quiz.i].it.pt)">🔊</button>` : ""}
    </div>
    <div class="opciones">${opciones}</div>
    ${q.elegida !== null ? `<div class="controles"><button class="btn" onclick="siguiente()">Siguiente →</button></div>` : ""}`;
}
function responder(k) {
  if (quiz.elegida !== null) return;
  const p = quiz.preguntas[quiz.i];
  quiz.elegida = k;
  if (p.opciones[k] === p.correcta) quiz.aciertos++;
  hablar(p.it.pt);
  pintarLeccion();
}
function siguiente() {
  quiz.i++;
  quiz.elegida = null;
  pintarLeccion();
  window.scrollTo(0, 0);
}

// ---------- inicio ----------
pintarVelocidad();
pintarProgreso();
ruta();
</script>
