<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Português">
<meta name="theme-color" content="#0b7a3e">
<title>Aprende Portugués Básico</title>
<script>
  // Aplica el tema antes de dibujar la página (evita el parpadeo blanco de noche)
  document.documentElement.dataset.tema = localStorage.getItem("pt-tema") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
</script>
<style>
  :root {
    color-scheme: light;
    --verde: #0b7a3e;
    --verde-claro: #e6f4ec;
    --amarillo: #ffd23f;
    --amarillo-claro: #fff8e1;
    --azul: #1d3c8f;          /* texto azul */
    --azul-fondo: #1d3c8f;    /* fondos azules con texto blanco */
    --texto: #1f2933;
    --gris: #6b7785;
    --fondo: #f5f7f6;
    --tarjeta: #fff;          /* fondo de tarjetas */
    --suave: #e3e8e5;         /* botones secundarios, pestañas */
    --borde: #dde3e0;
    --pron: #8a5a00;          /* guía de pronunciación */
    --bien-fuerte: #c8ecd6;
    --blanco: #fff;           /* texto sobre fondos de color */
    --error: #c62828;
    --error-claro: #fdecea;
    --casi: #e0a800;
    --casi-claro: #fff6d6;
    --radio: 14px;
  }
  :root[data-tema="oscuro"] {
    color-scheme: dark;
    --verde: #12924d;
    --verde-claro: #1c3328;
    --amarillo-claro: #352d14;
    --azul: #9db8ff;
    --azul-fondo: #2b4a9e;
    --texto: #e4ebe7;
    --gris: #9aa8a0;
    --fondo: #101613;
    --tarjeta: #1b231f;
    --suave: #2a3530;
    --borde: #36433c;
    --pron: #e8b864;
    --bien-fuerte: #23573a;
    --error: #ef6b6b;
    --error-claro: #3b1e1e;
    --casi: #f0c040;
    --casi-claro: #3a3015;
  }
  a { color: var(--azul); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--verde);
    color: var(--blanco);
    padding: calc(14px + env(safe-area-inset-top)) 18px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  .barra-top { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 1.25rem; margin: 0; flex: 1; }
  .btn-icono {
    background: rgba(255,255,255,.18); color: var(--blanco); border: 0;
    border-radius: 10px; padding: 8px 12px; font-size: .95rem; cursor: pointer;
  }
  @media (max-width: 420px) {
    header h1 { font-size: 1.05rem; white-space: nowrap; }
    .btn-icono { padding: 7px 9px; font-size: .88rem; }
  }
  .progreso { margin-top: 10px; font-size: .85rem; }
  .barra { background: rgba(255,255,255,.25); border-radius: 99px; height: 8px; margin-top: 5px; overflow: hidden; }
  .barra > div { background: var(--amarillo); height: 100%; transition: width .4s; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }

  .seccion { font-size: 1.05rem; margin: 18px 0 10px; }
  .seccion:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tarjeta-leccion {
    background: var(--tarjeta); border-radius: var(--radio); padding: 16px 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; position: relative;
    border: 2px solid transparent; transition: transform .1s;
  }
  .tarjeta-leccion:active { transform: scale(.97); }
  .tarjeta-leccion.hecha { border-color: var(--verde); }
  .tarjeta-leccion .ico { font-size: 2rem; }
  .tarjeta-leccion h3 { margin: 6px 0 2px; font-size: 1rem; }
  .tarjeta-leccion small { color: var(--gris); display: block; }
  .insignia {
    position: absolute; top: 10px; right: 10px; background: var(--verde); color: var(--blanco);
    font-size: .75rem; border-radius: 99px; padding: 2px 8px;
  }
  .repaso { background: var(--azul-fondo); color: var(--blanco); }
  .repaso small { color: #cfd8f5; }

  .volver { background: none; border: 0; color: var(--verde); font-size: 1rem; padding: 4px 0; cursor: pointer; }
  .intro { background: var(--verde-claro); border-radius: var(--radio); padding: 12px 14px; margin: 10px 0 14px; font-size: .95rem; }
  .pestanas {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
    background: var(--suave); padding: 4px; border-radius: 12px; margin-bottom: 14px;
  }
  .pestanas button {
    border: 0; background: none; padding: 7px 2px; border-radius: 9px; cursor: pointer;
    color: var(--texto); font-size: .72rem; display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .pestanas button span { font-size: 1.15rem; }
  .pestanas button.activa { background: var(--tarjeta); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .fila {
    display: flex; align-items: center; gap: 12px; background: var(--tarjeta);
    border-radius: 12px; padding: 12px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .fila:active { background: var(--verde-claro); }
  .altavoz {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: var(--verde-claro); font-size: 1.1rem; cursor: pointer;
  }
  .fila .quien { font-size: .78rem; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: .5px; }
  .fila .pt { font-weight: 600; font-size: 1.05rem; }
  .fila .es { color: var(--gris); }
  .pron { font-size: .88rem; color: var(--pron); font-style: italic; }
  .nota { font-size: .82rem; color: var(--azul); margin-top: 2px; }

  /* Teoría */
  .apunte {
    background: var(--tarjeta); border-radius: var(--radio); padding: 14px 16px;
    margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .apunte h3 { margin: 0 0 6px; color: var(--verde); font-size: 1.05rem; }
  .apunte p { margin: 6px 0; }
  .apunte ul { margin: 6px 0; padding-left: 20px; }
  .apunte li { margin: 3px 0; }
  .apunte .lista { margin-top: 8px; gap: 6px; }
  .apunte .fila { box-shadow: none; background: var(--fondo); padding: 8px 10px; }
  .apunte .fila .pt { font-size: 1rem; }
  .apunte .altavoz { width: 34px; height: 34px; font-size: .95rem; }
  .etiqueta-extra {
    font-size: .68rem; background: var(--azul-fondo); color: var(--blanco); border-radius: 99px;
    padding: 2px 8px; margin-left: 6px; vertical-align: middle; font-weight: 600; white-space: nowrap;
  }
  .porque, .ojo, .consejo { border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: .92rem; }
  .porque { background: var(--amarillo-claro); border-left: 4px solid var(--amarillo); }
  .consejo { background: var(--verde-claro); border-left: 4px solid var(--verde); }
  .consejo ul { margin: 4px 0 0; }
  td .pron { font-size: .85rem; }
  .ojo { background: var(--error-claro); border-left: 4px solid var(--error); }
  .resuelto { background: var(--fondo); border-radius: 10px; padding: 10px 12px; margin-top: 8px; border-left: 4px solid var(--verde); }
  .resuelto .r-frase { font-weight: 600; }
  .resuelto .r-exp { margin: 5px 0; font-size: .93rem; }
  .resuelto .r-resp { display: flex; align-items: center; gap: 8px; font-size: .93rem; }
  .resuelto .altavoz { width: 32px; height: 32px; font-size: .9rem; }
  .tabla-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 6px 0; }
  th, td { border: 1px solid var(--borde); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--verde-claro); }
  @media (max-width: 480px) {
    .apunte { padding: 12px 10px; }
    table { font-size: .82rem; }
    th, td { padding: 5px 5px; }
  }

  /* Tarjetas */
  .flash {
    background: var(--tarjeta); border-radius: 20px; min-height: 230px; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.1); cursor: pointer; user-select: none;
  }
  .flash .grande { font-size: 1.8rem; font-weight: 700; }
  .flash .ayuda { color: var(--gris); font-size: .85rem; margin-top: 14px; }
  .flash.volteada { background: var(--verde-claro); }
  .controles { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
  .controles.izq { justify-content: flex-start; margin-top: 10px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 18px; font-size: 1rem; cursor: pointer;
    background: var(--verde); color: var(--blanco); font-weight: 600;
  }
  .btn.sec { background: var(--suave); color: var(--texto); }
  .btn.peq { padding: 8px 14px; font-size: .9rem; }
  .contador { text-align: center; color: var(--gris); margin-top: 10px; font-size: .9rem; }

  /* Ejercicios */
  .marcador {
    background: var(--azul-fondo); color: var(--blanco); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px; font-size: .92rem;
  }
  .ej { background: var(--tarjeta); border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .ej .tipo { font-size: .8rem; color: var(--gris); margin-bottom: 4px; }
  .ej .frase { font-size: 1.1rem; line-height: 2.1; }
  .ej .trad { font-size: .85rem; color: var(--gris); }
  .ej .opciones { margin-top: 8px; }
  .hueco-txt { color: var(--verde); font-weight: 700; letter-spacing: 1px; }
  input.hueco {
    font-size: 16px; font-family: inherit; color: var(--texto); text-align: center;
    border: 0; border-bottom: 2px solid var(--verde); background: var(--verde-claro);
    border-radius: 6px 6px 0 0; padding: 3px 6px; margin: 0 3px; max-width: 100%;
  }
  input.hueco:disabled { opacity: 1; -webkit-text-fill-color: var(--texto); }
  input.hueco.bien { background: var(--bien-fuerte); }
  input.hueco.mal { border-color: var(--error); background: var(--error-claro); }
  input.hueco.casi { border-color: var(--casi); background: var(--casi-claro); }
  .res { margin-top: 8px; font-size: .95rem; }
  .res .explica { color: var(--azul); font-size: .88rem; margin-top: 4px; }
  .res .aviso { color: var(--casi); }

  /* Quiz */
  .pregunta { background: var(--tarjeta); border-radius: var(--radio); padding: 18px; text-align: center; margin-bottom: 12px; }
  .pregunta .tipo { color: var(--gris); font-size: .85rem; }
  .pregunta .grande { font-size: 1.5rem; font-weight: 700; margin: 6px 0; }
  .opciones { display: flex; flex-direction: column; gap: 8px; }
  .opcion {
    background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 12px; padding: 14px;
    font-size: 1rem; text-align: left; cursor: pointer; color: var(--texto);
  }
  .opcion:disabled { opacity: 1; color: var(--texto); cursor: default; }
  .opcion.bien { border-color: var(--verde); background: var(--verde-claro); }
  .opcion.mal { border-color: var(--error); background: var(--error-claro); }
  .resultado { text-align: center; background: var(--tarjeta); border-radius: var(--radio); padding: 26px 18px; }
  .resultado .pct { font-size: 3rem; font-weight: 800; color: var(--verde); }
  footer { text-align: center; color: var(--gris); font-size: .8rem; margin-top: 30px; }

  /* Práctica sin fin */
  .practica-card {
    background: linear-gradient(135deg, var(--verde), #13a356); color: var(--blanco); border-radius: var(--radio);
    padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 14px; box-shadow: 0 3px 10px rgba(11,122,62,.3);
  }
  .practica-card .ico { font-size: 2.4rem; }
  .practica-card h3 { margin: 0; font-size: 1.1rem; }
  .practica-card small { opacity: .9; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; margin: 10px 0 4px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex: none; border: 0; border-radius: 99px; padding: 8px 12px; background: var(--suave);
    color: var(--texto); font-size: .85rem; cursor: pointer;
  }
  .chip.activa { background: var(--verde); color: var(--blanco); font-weight: 600; }
  .modo { display: flex; gap: 6px; margin-bottom: 10px; }
  .stats {
    display: flex; justify-content: space-between; background: var(--azul-fondo); color: var(--blanco);
    border-radius: 12px; padding: 9px 14px; font-size: .9rem; margin-bottom: 10px;
  }
  .btn-escuchar {
    font-size: 2rem; width: 80px; height: 80px; border-radius: 50%; border: 0; margin: 6px auto;
    background: var(--verde-claro); cursor: pointer; display: block;
  }
  .escribir { display: flex; gap: 8px; align-items: center; }
  .escribir input.hueco { flex: 1; font-size: 18px; padding: 10px; border-radius: 10px 10px 0 0; }
  .pr-res { background: var(--tarjeta); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .pr-res .frase-oir { font-weight: 600; margin-top: 6px; }
  .pr-res .trad { color: var(--gris); font-size: .9rem; }
  .btn.ancho { width: 100%; padding: 16px; font-size: 1.1rem; }
</style>
</head>
<body>
<header>
  <div class="barra-top">
    <h1>🇧🇷 Aprende Portugués</h1>
    <button class="btn-icono" id="btnVelocidad" onclick="cambiarVelocidad()">🐇 Normal</button>
    <button class="btn-icono" id="btnTema" onclick="cambiarTema()" aria-label="Cambiar tema">🌙</button>
  </div>
  <div class="progreso">
    <span id="txtProgreso"></span>
    <div class="barra"><div id="barraProgreso" style="width:0"></div></div>
  </div>
</header>
<main id="app"></main>

<script>
// ---------------------------------------------------------------
// CONTENIDO
// Cada lección tiene:
//   grupo:      "curso" (de mis clases) o "extra" (práctica adicional)
//   apuntes:    bloques de teoría {t, p, tabla: {cab, filas}, lista, ej: [[pt, es]], dialogo: [[quién, pt, es]],
//               porque, ojo, extra: true}   ·  **negrita**  *cursiva*
//   items:      vocabulario {pt, es, n}  (n = nota opcional)
//   ejercicios: {tipo: "completar", frase: "Eu ___ estudante.", resp: ["sou"], pista, trad, explica}
//               {tipo: "marcar", frase: "...", opciones: [...], resp: índice (desde 0), explica, oir}
//               En "completar", cada ___ es un hueco y resp lleva una respuesta por hueco
//               (o una lista de respuestas válidas: [["bem", "bom"]]).
// ---------------------------------------------------------------
const LECCIONES = [
  // =============================== MI CURSO ===============================
  {
    id: "alfabeto", grupo: "curso", icono: "🔤", titulo: "Alfabeto y pronunciación",
    intro: "Antes de hablar hay que reconocer los sonidos. El portugués de Brasil se escribe parecido al español, pero varias letras suenan distinto.",
    apuntes: [
      { t: "Cómo leer la pronunciación 🗣️", extra: true,
        p: "En toda la página, debajo de cada palabra en portugués verás cómo se pronuncia, escrito para que lo leas como en español:",
        tabla: { cab: ["Si ves...", "Pronúncialo como...", "Ejemplo"], filas: [
          ["**zh**", "la *j* del francés o la *y* argentina", "janela → *zhanéla*"],
          ["**sh**", "la *sh* del inglés (*show*)", "chave → *shávi*"],
          ["**j**", "una *j* suave, casi aspirada", "Rio → *Jíu*"],
          ["**dyi** / **chi**", "*de, di* / *te, ti* del portugués", "cidade → *sidádyi*, leite → *léichi*"],
          ["**lli** / **ñ**", "*lh* / *nh*", "filho → *fílliu*, vinho → *víñu*"],
          ["**aun, ain, oin, ein**", "vocales nasales (el aire sale también por la nariz)", "não → *naun*, homem → *ómein*"],
          ["**z**", "una *s* que zumba (como una abeja)", "casa → *káza*"],
          ["tilde (á, é...)", "la sílaba que suena más fuerte", "obrigado → *obrigádu*"]] },
        porque: "Es una **aproximación** para ayudarte a leer: la referencia real es el audio 🔊. Escucha siempre y repite." },
      { t: "O alfabeto",
        p: "Tiene 26 letras, como el español, pero **sin la ñ** (se escribe **nh**). Así se llaman las letras:",
        tabla: { cab: ["Letra", "Nombre", "Letra", "Nombre"], filas: [
          ["A", "á", "N", "êni"], ["B", "bê", "O", "ó"], ["C", "cê", "P", "pê"], ["D", "dê", "Q", "quê"],
          ["E", "é", "R", "érre (éje)"], ["F", "éfi", "S", "ési"], ["G", "gê", "T", "tê"], ["H", "agá", "U", "u"],
          ["I", "i", "V", "vê"], ["J", "jóta", "W", "dáblio"], ["K", "cá", "X", "xis"], ["L", "éli", "Y", "ípsilon"],
          ["M", "êmi", "Z", "zê"], ["", "", "", ""]] },
        ej: [["Como se escreve o seu nome?", "¿Cómo se escribe tu nombre?"], ["agá", "H"], ["jota", "J"], ["dáblio", "W"], ["xis", "X"], ["ípsilon", "Y"]],
        porque: "Sirve para **deletrear** tu nombre, apellido o correo. En Brasil te lo van a preguntar mucho: *Como se escreve?* (¿Cómo se escribe?)." },
      { t: "Fonética: los sonidos peculiares",
        p: "Estos son los sonidos que más cambian respecto al español:",
        tabla: { cab: ["Se escribe", "Suena como", "Ejemplo"], filas: [
          ["j, ge, gi", "**zh** (la j del francés)", "**J**úlio é um jovem **gi**gante."],
          ["de, di", "**dyi** (como *yi*)", "Bom **di**a, Cláu**di**a."],
          ["r inicial, rr", "**j** suave", "O **R**ei; o ca**rr**o"],
          ["te, ti", "**chi**", "O lei**te** está quen**te**."],
          ["ch, x", "**sh** del inglés", "Ela toma **ch**á na **x**ícara."],
          ["lh", "**lli** (una 'li' rápida)", "O mo**lh**o fica me**lh**or com a**lh**o."],
          ["ce, ci, s, ss, ç", "**s**", "A**ç**úcar ou ado**ç**ante?"],
          ["nh", "**ñ**", "Eu so**nh**ei com a Nicole."],
          ["z, s entre vocales", "**z** zumbada", "Teresa tem uma bele**z**a de ca**s**a."],
          ["v", "**v** (dientes sobre el labio)", "**V**amos **v**iajar."]] },
        porque: "Abajo tienes **cada sonido por separado**, con muchos ejemplos. Toca cada uno, escúchalo y repítelo en voz alta: así se entrena el oído y la boca." },
      { t: "1. J, GE, GI → suena «zh»",
        p: "Suena como la **j del francés** (*Jean*) o la **y / ll argentina** (*yo, calle*): la lengua no toca el paladar y el aire vibra. **Nunca** como la j española.",
        ej: [["janela", "ventana"], ["jovem", "joven"], ["hoje", "hoy"], ["queijo", "queso"], ["laranja", "naranja"], ["gente", "gente"],
             ["gelo", "hielo"], ["girafa", "jirafa"], ["viagem", "viaje"], ["Júlio é um jovem gigante.", "Julio es un joven gigante."],
             ["O jogador comeu o queijo.", "El jugador se comió el queso."], ["Aquele gato sujo na janela.", "Ese gato sucio en la ventana."],
             ["O gerente foi gentil.", "El gerente fue amable."], ["A girafa está lá bem longe.", "La jirafa está allá bien lejos."]],
        consejos: ["**ga, go, gu** suenan con **g** normal: *gato, gosto, agulha*. Solo **ge, gi** y la **j** suenan *zh*.",
                   "Compara: **g**ato (g) / **ge**nte (zh) · **go**sto (g) / **gi**rafa (zh)."] },
      { t: "2. DE, DI → suena «dyi»",
        p: "La **d** seguida del sonido **i** suena **dy** (como la *j* del inglés *jeans*). Pasa con **di** y con **de** al final de palabra, porque esa *e* final suena *i*.",
        ej: [["dia", "día"], ["cidade", "ciudad"], ["tarde", "tarde"], ["dinheiro", "dinero"], ["verdade", "verdad"], ["idade", "edad"],
             ["onde", "dónde"], ["grande", "grande"], ["diferente", "diferente"], ["saudade", "nostalgia, extrañar"],
             ["Bom dia, Cláudia.", "Buen día, Claudia."], ["Boa tarde, doutor advogado.", "Buenas tardes, doctor abogado."],
             ["O direito é sagrado.", "El derecho es sagrado."], ["A saúde da comunidade.", "La salud de la comunidad."], ["A verdade dói.", "La verdad duele."]],
        consejos: ["**da, do, du** suenan con **d** normal: *dado, dor, duro*.",
                   "En *idade* la **da** suena con *d* normal y solo la **de** del final suena *dyi*: *idádyi*."],
        ojo: "En el material dice *Os direito é sagrado*; lo correcto es **O direito é sagrado** (singular)." },
      { t: "3. R inicial y RR → suena «j» suave",
        p: "La **r al inicio** de palabra y la **rr** suenan como una **j suave**, aspirada (como cuando echas aire para empañar un vidrio). La **r sola entre vocales** es suave, como en español *pero*.",
        ej: [["Rio", "Río"], ["rua", "calle"], ["rato", "ratón"], ["roupa", "ropa"], ["rosa", "rosa"], ["rápido", "rápido"],
             ["carro", "auto"], ["terra", "tierra"], ["cachorro", "perro"], ["O rei é autoritário.", "El rey es autoritario."],
             ["Rafael roubou suas roupas.", "Rafael robó sus ropas."], ["O cachorro vai ladrar.", "El perro va a ladrar."],
             ["Fernando é um garoto irritante.", "Fernando es un chico irritante."], ["O carro daquele cara é caro.", "El auto de ese tipo es caro."]],
        consejos: ["Par clave: **caro** (*cáru*, caro) vs **carro** (*cáju*, auto). ¡Una r o dos cambian el significado!",
                   "Después de **n, l, s** la r también suena *j*: *honra* → *ónja*."] },
      { t: "4. TE, TI → suena «chi»",
        p: "La **t** seguida del sonido **i** suena **ch** (como en *chico*). Pasa con **ti** y con **te** al final de palabra.",
        ej: [["leite", "leche"], ["noite", "noche"], ["tio", "tío"], ["tia", "tía"], ["sete", "siete"], ["vinte", "veinte"],
             ["gente", "gente"], ["quente", "caliente"], ["tímido", "tímido"], ["time", "equipo (de fútbol)"],
             ["O filme foi ótimo, Tiago.", "La película fue excelente, Tiago."], ["Meu tio é interessante.", "Mi tío es interesante."],
             ["O leite está quente.", "La leche está caliente."], ["O teatro só abre à noite.", "El teatro solo abre de noche."]],
        consejos: ["**ta, to, tu** suenan con **t** normal: *tatu, todo, tudo*.",
                   "La **e** delante de otra vocal también suena *i*, así que *teatro* se dice *chiátru*."] },
      { t: "5. CH, X → suena «sh»",
        p: "La **ch** y casi siempre la **x** suenan **sh** (como en inglés *show*), **nunca** como la *ch* española.",
        ej: [["chá", "té"], ["chave", "llave"], ["chuva", "lluvia"], ["chocolate", "chocolate"], ["xícara", "taza"], ["peixe", "pescado"],
             ["caixa", "caja"], ["baixo", "bajo"], ["roxo", "morado"], ["abacaxi", "piña"], ["Ela toma chá na xícara.", "Ella toma té en la taza."],
             ["Peixe frito ou na chapa?", "¿Pescado frito o a la plancha?"], ["As chaves da porta.", "Las llaves de la puerta."],
             ["Acho que vai chover.", "Creo que va a llover."]],
        consejos: ["*chocolate* se dice *shocoláchi*: ¡la ch nunca suena como en español!",
                   "Excepciones de la **x**: suena *ks* en **táxi**, *s* en **próximo** y *z* en **exemplo**."] },
      { t: "6. LH → suena «lli»",
        p: "Se parece a una **doble l** (*lli*): la lengua se apoya en el paladar, como una *li* muy rápida y pegada a la vocal.",
        ej: [["filho", "hijo"], ["filha", "hija"], ["mulher", "mujer"], ["trabalho", "trabajo"], ["olho", "ojo"], ["alho", "ajo"],
             ["melhor", "mejor"], ["folha", "hoja"], ["velho", "viejo"], ["milho", "maíz"], ["O molho fica melhor com alho.", "La salsa queda mejor con ajo."],
             ["Você é maravilhosa.", "Eres maravillosa."], ["Tenho orgulho de ser mulher.", "Tengo orgullo de ser mujer."],
             ["Não mete a colher na vida alheia.", "No metas la cuchara en la vida ajena."]],
        porque: "Muchas palabras con **j** en español tienen **lh** en portugués: *hijo → filho, mujer → mulher, ojo → olho, ajo → alho, trabajo → trabalho, hoja → folha*. ¡Es un patrón muy útil!",
        ojo: "En el material dice *Não mete a colher vida alheia*; falta el **na**: *Não mete a colher **na** vida alheia*." },
      { t: "7. CE, CI, S, SS, Ç → suena «s»",
        p: "Todas estas suenan **s**, como en español: **ce, ci**, la **s** al inicio de palabra, la **ss** entre vocales y la **ç**.",
        ej: [["cebola", "cebolla"], ["cidade", "ciudad"], ["cinema", "cine"], ["sapato", "zapato"], ["sol", "sol"], ["pássaro", "pájaro"],
             ["massa", "masa, pasta"], ["açúcar", "azúcar"], ["coração", "corazón"], ["criança", "niño, niña"],
             ["O lenço de Cecília é azul.", "El pañuelo de Cecilia es azul."], ["Açúcar ou adoçante?", "¿Azúcar o edulcorante?"],
             ["Cenoura e alface na salada.", "Zanahoria y lechuga en la ensalada."], ["Assassino e assediador.", "Asesino y acosador."]],
        consejos: ["Ojo: una sola **s entre vocales** suena **z** (*casa* → *káza*). Para que suene *s* entre vocales se escribe **ss**: *massa* → *mása*.",
                   "Par clave: **casa** (*káza*, casa) vs **caça** (*kása*, caza)."] },
      { t: "El uso de la Ç (cedilha)",
        p: "La **ç** solo va antes de **a, o, u**, y hace que la c suene **/s/** en vez de **/k/**:",
        ej: [["cabeça", "cabeza"], ["pescoço", "cuello"], ["açúcar", "azúcar"], ["coração", "corazón"], ["criança", "niño, niña"],
             ["maçã", "manzana"], ["praça", "plaza"], ["almoço", "almuerzo"], ["dança", "baile"], ["força", "fuerza"],
             ["A criança come maçã na praça.", "El niño come manzana en la plaza."]],
        porque: "Sin cedilla, **ca, co, cu** suenan *ka, ko, ku*. Antes de **e, i** no hace falta porque la c ya suena s (*cidade, cebola*). Por eso **nunca** verás *çe* ni *çi*." },
      { t: "8. NH → suena «ñ»",
        p: "Suena como la **ñ** española: **nh = ñ**. Al hablar rápido, **ni / ne** + vocal también pueden sonar parecido (*Eliane*).",
        ej: [["vinho", "vino"], ["banho", "baño"], ["manhã", "mañana"], ["sonho", "sueño"], ["ninho", "nido"], ["carinho", "cariño"],
             ["senhor", "señor"], ["cozinha", "cocina"], ["amanhã", "mañana (el día siguiente)"], ["dinheiro", "dinero"],
             ["O garotinho é animado.", "El niñito es animado."], ["Eliane fez o caminho.", "Eliane hizo el camino."],
             ["Eu sonhei com a Nicole.", "Soñé con Nicole."], ["Não tenho dinheiro nenhum.", "No tengo nada de dinero."]],
        porque: "Donde el español tiene **ñ**, el portugués casi siempre tiene **nh**: *señor → senhor, mañana → manhã, cariño → carinho, España → Espanha*." },
      { t: "9. Z (y S entre vocales) → «z» zumbada",
        p: "La **z** suena como una **s que zumba** (como una abeja: *zzz*). La **s entre vocales** suena igual. Al **final** de palabra, la z suena *s*.",
        ej: [["zero", "cero"], ["zebra", "cebra"], ["azul", "azul"], ["fazer", "hacer"], ["doze", "doce"], ["prazer", "placer, gusto"],
             ["beleza", "belleza"], ["casa", "casa"], ["mesa", "mesa"], ["dez", "diez (al final suena s)"],
             ["Os amigos de Teresa têm uma beleza de casa, por exemplo.", "Los amigos de Teresa tienen una casa bellísima, por ejemplo."],
             ["Muito prazer!", "¡Mucho gusto!"], ["A casa azul é bonita.", "La casa azul es bonita."]],
        porque: "En el español de Latinoamérica la z suena *s*, pero en portugués la diferencia importa: pon el dedo en la garganta y di *zzz*: tiene que vibrar." },
      { t: "10. V → con los dientes sobre el labio",
        p: "En portugués la **v** y la **b** suenan **distinto**: la **v** se hace apoyando los **dientes de arriba sobre el labio de abajo** y haciendo vibrar el aire (como en inglés *very*).",
        ej: [["vinho", "vino"], ["vida", "vida"], ["você", "tú"], ["viagem", "viaje"], ["verde", "verde"], ["novo", "nuevo"],
             ["uva", "uva"], ["vaca", "vaca"], ["avó", "abuela"], ["vamos", "vamos"], ["Vamos viajar para Nova Iorque.", "Vamos a viajar a Nueva York."],
             ["O vinho verde é delicioso.", "El vino verde es delicioso."], ["A vovó vive na vila.", "La abuelita vive en el pueblo."]],
        consejos: ["Par clave: **vela** (vela) vs **bela** (bella): solo cambia la v por la b.",
                   "Para practicar: muerde suavemente el labio de abajo y di *vvvv*, sintiendo cómo vibra."] },
      { t: "11. ÃO, AM → nasal «aun»",
        p: "La **~** sobre la *a* (**ão**) y el final **-am** de los verbos suenan *aun*, con el aire saliendo también **por la nariz**:",
        ej: [["não", "no"], ["mão", "mano"], ["pão", "pan"], ["são", "son"], ["coração", "corazón"], ["irmão", "hermano"],
             ["estão", "están"], ["falam", "hablan"], ["foram", "fueron"], ["cantam", "cantan"], ["São amigos do coração.", "Son amigos del alma."],
             ["Eles estavam aqui há pouco.", "Ellos estaban aquí hace poco."], ["Segura a minha mão.", "Sostén mi mano."], ["Viviam em união.", "Vivían en unión."]],
        porque: "Muchos verbos en plural terminan en **-am** (eles falam, eles gostam) y suenan nasales, como *fálaun*. Si los pronuncias con una m normal, cuesta entenderte." },
      { t: "12. ÃE, ÕE, EM → otras nasales",
        tabla: { cab: ["Escritura", "Suena", "Ejemplos"], filas: [
          ["ãe, ães", "**ain**", "mãe, pães, cães"], ["õe, ões", "**oin**", "põe, limões, canções"], ["-em, -ens", "**ein**", "bem, também, homens"], ["ui (en *muito*)", "**uin**", "muito → *múintu*"]] },
        ej: [["mãe", "madre"], ["pães", "panes"], ["cães", "perros"], ["alemães", "alemanes"], ["põe", "pone"], ["limões", "limones"],
             ["canções", "canciones"], ["bem", "bien"], ["também", "también"], ["homem", "hombre"], ["ontem", "ayer"], ["jovem", "joven"],
             ["A mãe não está.", "La madre no está."], ["Põe mais três limões verdes.", "Pon tres limones verdes más."],
             ["Ele é um homem de bem.", "Él es un hombre de bien."], ["Carmen também tem cinquenta anos.", "Carmen también tiene cincuenta años."]],
        consejos: ["En **homem** la *h* no suena y el final **-em** es nasal: *ómein*. Lo mismo en *também* (*tambéin*) y *jovem* (*zhóvein*).",
                   "La **h** al inicio nunca suena: *hoje* → *ózhi*, *hora* → *óra*."] },
      { t: "13. La O: cerrada, abierta y débil",
        tabla: { cab: ["Sonido", "Ejemplo"], filas: [
          ["**ô** cerrada", "Meu av**ô** morreu novo. (abuelo)"], ["**ó** abierta", "Minha av**ó** não tomava sol. (abuela)"],
          ["o final débil → **u**", "O sapat**o** d**o** Manuel. (*sapatu du*)"], ["om, on nasal", "**On**tem o s**om** estava b**om**."]] },
        ej: [["avô", "abuelo (ô cerrada)"], ["avó", "abuela (ó abierta)"], ["novo", "nuevo (ô cerrada)", "nôvu"], ["nova", "nueva (ó abierta)", "nóva"],
             ["ovo", "huevo (ô cerrada)", "ôvu"], ["ovos", "huevos (¡ó abierta!)", "óvus"], ["sapato", "zapato (o final → u)"],
             ["livro", "libro (o final → u)"], ["bom", "bueno (nasal)"], ["som", "sonido (nasal)"],
             ["Meu avô morreu novo.", "Mi abuelo murió joven."], ["Minha avó não tomava sol.", "Mi abuela no tomaba sol."],
             ["Alguém almoçou sarapatel.", "Alguien almorzó sarapatel (guiso típico)."], ["O sapato do Manuel.", "El zapato de Manuel."],
             ["Ontem o som estava bom.", "Ayer el sonido estaba bueno."], ["Não posso comer ovos.", "No puedo comer huevos."]],
        porque: "El acento cambia el significado: **avô** (abuelo) y **avó** (abuela) solo se diferencian en si la o es cerrada o abierta. Curiosidad: *ovo* tiene **ô** cerrada, pero el plural *ovos* tiene **ó** abierta (igual *novo* / *nova*, *novos*). Escucha el audio para notarlo." }

const mezclar = arr => {

};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s)
  .replace(/\\\*/g, "&#42;")
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\*(.+?)\*/g, "<em>$1</em>")
  .replace(/___/g, '<span class="hueco-txt">____</span>');
const normalizar = s => s.toLowerCase().trim().replace(/[.!?¿¡,;:]+$/g, "").replace(/\s+/g, " ");
const sinTildes = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const sinMd = s => String(s).replace(/\\?\*/g, "");
const sinParentesis = s => s && s.replace(/\s*\([^)]*\)/g, "");   // las pistas entre paréntesis no se leen en voz alta
const filaAudio = (pt, es, nota, quien, pr) => `

    </div>
  </div>`;

// ---------- guía de pronunciación (portugués de Brasil, escrita para hispanohablantes) ----------
// zh = j francesa · sh = sh inglesa · j = j suave · ñ = nh · lli = lh · dyi / chi = de, di / te, ti
// aun, ain, oin, ein = nasales · la tilde marca la sílaba fuerte
const PRON_EXCEPCIONES = {
  muito: "múintu", muita: "múinta", muitos: "múintus", muitas: "múintas", ainda: "aínda", sexta: "sésta", sextas: "séstas",
  ao: "au", aos: "aus", tv: "tevê", paradoxo: "paradóksu", próxima: "prósima", próximo: "prósimu", próximas: "prósimas",
  sair: "saír", táxi: "táksi", pizza: "pítsa", videogame: "videoguêimi", eua: "e-u-á", fox: "fóks",
  cinquenta: "sincuénta", teatro: "chiátru",
  robert: "jóberchi", brighton: "bráitun", callao: "caiáu", luiz: "luís", werner: "vérner", martinelli: "marchinéli"
};
const VOCALES = "aáâãàeéêiíoóôõuú";
const CON_ACENTO = /[áéíóúâêô]/;
function pronPalabra(palabra) {
  const s = palabra.toLowerCase(), n = s.length;
  let r = PRON_EXCEPCIONES[s];
  if (!r) {
    const esVocal = i => i >= 0 && i < n && VOCALES.includes(s[i]);
    const uMuda = i => s[i] === "u" && (s[i - 1] === "q" || s[i - 1] === "g") && esVocal(i + 1);
    const vocal = i => esVocal(i) && !uMuda(i);
    // Núcleos de sílaba (vocal o diptongo)
    const nucleos = [];
    for (let i = 0; i < n;) {
      if (!vocal(i)) { i++; continue; }
      let j = i + 1;
      const par = s.slice(i, i + 2);
      if (["ão", "ãe", "õe"].includes(par)) j = i + 2;
      else if ("aáâeéêoóô".includes(s[i]) && /^[iu]$/.test(s[i + 1] || "")) j = i + 2;
      else if (par === "ui" || par === "iu") j = i + 2;
      nucleos.push({ a: i, b: j });
      i = j;
    }
    // Sílaba tónica
    let t = nucleos.findIndex(x => CON_ACENTO.test(s.slice(x.a, x.b)));
    if (t < 0) t = nucleos.findIndex(x => /[ãõ]/.test(s.slice(x.a, x.b)));
    if (t < 0) {
      const sinS = s.replace(/s$/, "");
      const llana = /[aeo]$/.test(sinS) || /(am|em|en)$/.test(sinS);
      t = nucleos.length >= 2 && llana ? nucleos.length - 2 : nucleos.length - 1;
    }
    const mono = nucleos.length === 1;
    const marcar = !mono || CON_ACENTO.test(s);
    const tildar = v => v.replace(/[aeiou]/, c => ({ a: "á", e: "é", i: "í", o: "ó", u: "ú" }[c]));
    // Cómo suena cada vocal
    const sale = {};
    nucleos.forEach((x, k) => {
      const txt = s.slice(x.a, x.b).replace("à", "a");
      const resto = s.slice(x.b);
      const ultima = k === nucleos.length - 1;
      let v;
      if (txt === "ão") v = "aun";
      else if (txt === "ãe") v = "ain";
      else if (txt === "õe") v = "oin";
      else if (txt === "ã") v = "an";
      else if (txt === "õ") v = "on";
      else if (ultima && resto === "m") {
        v = { a: "aun", e: "ein", i: "in", o: "on", u: "un" }[sinTildes(txt[0])] || txt;
        if (CON_ACENTO.test(txt[0])) v = txt[0] + v.slice(1);
        sale[x.b] = "";
      } else if (ultima && resto === "ns" && sinTildes(txt) === "e") {
        v = CON_ACENTO.test(txt) ? txt + "in" : "ein";
        sale[x.b] = "";
      } else if (ultima && /^s?$/.test(resto) && /^[eo]$/.test(txt) && (k !== t || (mono && !CON_ACENTO.test(s)))) {
        v = txt === "e" ? "i" : "u";
      } else v = txt;
      if (k === t && marcar && !CON_ACENTO.test(v)) v = tildar(v);
      sale[x.a] = v;
      for (let i = x.a + 1; i < x.b; i++) sale[i] = "";
    });
    const suenaI = i => /^[ií]/.test(sale[i + 1] || "");
    const eI = c => /[eéêií]/.test(c || "");
    r = "";
    for (let i = 0; i < n; i++) {
      if (i in sale) { r += sale[i]; continue; }
      const c = s[i], sig = s[i + 1], ant = s[i - 1];
      if (c === "h") continue;                                       // la h no suena
      else if (c === "c") { if (sig === "h") { r += "sh"; i++; } else r += eI(sig) ? "s" : "c"; }
      else if (c === "ç") r += "s";
      else if (c === "q") { if (sig === "u") { r += eI(s[i + 2]) ? "qu" : "cu"; i++; } else r += "c"; }
      else if (c === "g") { if (uMuda(i + 1)) { r += "gu"; i++; } else r += eI(sig) ? "zh" : "g"; }
      else if (c === "j") r += "zh";
      else if (c === "l") {
        if (sig === "h") { r += suenaI(i + 1) ? "ll" : "lli"; i++; }
        else if (!vocal(i + 1)) r += /[uú]$/.test(r) ? "" : "u";    // l final suena u: Brasil → brazíu
        else r += "l";
      }
      else if (c === "n") { if (sig === "h") { r += "ñ"; i++; } else r += "n"; }
      else if (c === "r") { if (i === 0 || "nls".includes(ant)) r += "j"; else if (sig === "r") { r += "j"; i++; } else r += "r"; }
      else if (c === "s") {
        if (sig === "s") { r += "s"; i++; }
        else if (sig === "c" && eI(s[i + 2])) { r += "s"; i++; }               // sc + e/i = una sola s: crescer → cresér
        else r += vocal(i - 1) && vocal(i + 1) ? "z" : "s";
      }
      else if (c === "x") r += i === 1 && s[0] === "e" && vocal(2) ? "z" : "sh";
      else if (c === "z") r += i === n - 1 ? "s" : "z";
      else if (c === "t") { if (sig === "c" && s[i + 2] === "h") { r += "ch"; i += 2; } else r += suenaI(i) ? "ch" : "t"; }
      else if (c === "d") r += suenaI(i) ? "dy" : "d";
      else if (c === "y") r += "i";
      else if (c === "w") r += "u";
      else r += c;
    }
  }
  return palabra[0] !== palabra[0].toLowerCase() ? r[0].toUpperCase() + r.slice(1) : r;
}
const pron = texto => sinMd(texto).replace(/[A-Za-zÀ-ÿ]+/g, pronPalabra);

// ---------- voz ----------
function vozPortugues() {
  const voces = speechSynthesis.getVoices();
  return voces.find(v => v.lang === "pt-BR" || v.lang === "pt_BR") ||
         voces.find(v => v.lang.startsWith("pt"));
}
let vozActual = null;   // referencia para que el navegador no la descarte mientras habla
function hablar(texto, op = {}) {
  if (!("speechSynthesis" in window)) { alert("Tu navegador no permite reproducir voz. Prueba con Safari o Chrome actualizados."); return; }
  const synth = window.speechSynthesis;
  const u = new SpeechSynthesisUtterance(texto.replace(/\.\.\./g, ""));
  u.lang = "pt-BR";
  const v = op.sinVoz ? null : vozPortugues();
  if (v) u.voice = v;
  u.rate = velocidadLenta ? 0.6 : 0.9;
  u.volume = 1;
  if (op.inicio) u.onstart = op.inicio;
  if (op.fin) u.onend = op.fin;
  if (op.error) u.onerror = e => op.error(e.error || "desconocido");
  vozActual = u;
  synth.resume();
  // En Safari (iPhone), cancelar y hablar al mismo instante a veces deja la voz muda: se espera un momento
  if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(() => synth.speak(u), 120); }
  else synth.speak(u);
}
if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => { if (location.hash === "#/audio") pintarAudio(); };
  // iPhone: la voz solo se activa tras un toque del usuario; el primer toque la "despierta" en silencio
  const despertar = () => {
    if (!speechSynthesis.speaking) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
  };
  document.addEventListener("touchend", despertar, { once: true });
  document.addEventListener("click", despertar, { once: true });
}

function guardarNota(id, pct) {
  if (pct > (progreso[id] || 0)) {

  }

  document.getElementById("barraProgreso").style.width = (hechas / LECCIONES.length * 100) + "%";
}

// ---------- navegación ----------
// Rutas: #/  ·  #/l/<lección>  ·  #/l/<lección>/<pestaña>
function ruta() {
  if (location.hash === "#/audio") { leccion = null; pintarAudio(); return; }
  const mp = location.hash.match(/^#\/practica(?:\/(\w+))?/);
  if (mp) {
    leccion = null;
    abrirPractica(CATEGORIAS.some(c => c.id === mp[1]) ? mp[1] : "todo");
    return;
  }
  const m = location.hash.match(/^#\/l\/(\w+)(?:\/(\w+))?/);
  if (m) {
    leccion = m[1] === "repaso"
      ? { id: "repaso", icono: "🏆", titulo: "Repaso general",
          intro: "Vocabulario, ejercicios y quiz mezclados de todas las lecciones.",
          items: LECCIONES.flatMap(l => l.items),
          ejercicios: mezclar(LECCIONES.flatMap(l => l.ejercicios || [])).slice(0, 15) }
      : LECCIONES.find(l => l.id === m[1]);
    if (leccion) {
      const disponibles = pestanasDe(leccion).map(p => p.id);
      pestana = disponibles.includes(m[2]) ? m[2] : (leccion.id === "repaso" ? "quiz" : disponibles[0]);
      prepararPestana();
      pintarLeccion();
      window.scrollTo(0, 0);
      return;
    }
  }
  leccion = null;
  pintarInicio();
}
window.addEventListener("hashchange", ruta);

function pestanasDe(l) { return PESTANAS.filter(p => p.hay(l)); }
function prepararPestana() {
  if (pestana === "tarjetas") { mazo = leccion.items.map((_, i) => i); tarjetaIdx = 0; volteada = false; }
  if (pestana === "quiz") quiz = crearQuiz(leccion.items);
  if (pestana === "ejercicios") ejRes = leccion.ejercicios.map(() => null);
}
function cambiarPestana(p) {
  pestana = p;
  history.replaceState(null, "", `#/l/${leccion.id}/${p}`);
  prepararPestana();
  pintarLeccion();
  window.scrollTo(0, 0);
}

function tarjetaLeccion(l) {

  return `
    <div class="tarjeta-leccion ${hecha ? "hecha" : ""}" onclick="location.hash='#/l/${l.id}'">
      ${nota ? `<span class="insignia">${hecha ? "✓ " : ""}${nota}%</span>` : ""}
      <div class="ico">${l.icono}</div>
      <h3>${esc(l.titulo)}</h3>
      <small>${l.items.length} palabras · ${(l.ejercicios || []).length} ejercicios</small>
      ${notaEj !== undefined ? `<small>✏️ Ejercicios: ${notaEj}%</small>` : ""}
    </div>`;
}
function pintarInicio() {
  const notaRepaso = progreso.repaso || 0;
  $app.innerHTML = `
    <div class="practica-card" onclick="location.hash='#/practica'">
      <div class="ico">🚌</div>

function htmlApuntes() {
  // t.pron = columnas a las que se les agrega al lado una columna de pronunciación
  const tabla = t => {
    const expandir = (fila, celda) => fila.flatMap((c, k) => t.pron && t.pron.includes(k) ? [md(c), celda(c)] : [md(c)]);
    return `
    <div class="tabla-wrap"><table>
      ${t.cab.some(c => c) ? `<tr>${expandir(t.cab, () => "🗣️").map(c => `<th>${c}</th>`).join("")}</tr>` : ""}
      ${t.filas.map(f => `<tr>${expandir(f, c => c ? `<span class="pron">${esc(pron(c))}</span>` : "").map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
  };
  // El bloque "Cómo resolver los ejercicios" de cada lección va al final de la teoría
  const r = leccion.resolver;
  const bloques = r ? leccion.apuntes.concat([{ id: "resolver", t: "🧩 Cómo resolver los ejercicios", p: r.p, lista: r.pasos,
                                                resueltos: r.resueltos, consejos: r.consejos }]) : leccion.apuntes;
  return bloques.map(a => `
    <div class="apunte" ${a.id ? `id="${a.id}"` : ""}>
      ${a.t ? `<h3>${esc(a.t)}${a.extra ? `<span class="etiqueta-extra">➕ Extra</span>` : ""}</h3>` : ""}
      ${a.p ? `<p>${md(a.p)}</p>` : ""}
      ${a.tabla ? tabla(a.tabla) : ""}
      ${a.lista ? `<ul>${a.lista.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : ""}
      ${a.ej ? `<div class="lista">${a.ej.map(([pt, es, pr]) => filaAudio(pt, es, null, null, pr)).join("")}</div>` : ""}
      ${a.dialogo ? `<div class="lista">${a.dialogo.map(([quien, pt, es, pr]) => filaAudio(pt, es, null, quien, pr)).join("")}</div>` : ""}
      ${a.resueltos ? a.resueltos.map((x, i) => {
        const antes = x.f.split("___")[0];
        const r = sinParentesis(x.r);
        const respuesta = !antes.trim() || /[.!?]\s*$/.test(antes) ? r[0].toUpperCase() + r.slice(1) : r;   // mayúscula al inicio de oración
        const frase = sinMd(x.f.replace("___", respuesta));
        return `
        <div class="resuelto">
          <div class="r-frase">${i + 1}. ${md(x.f)}</div>
          <div class="r-exp">👉 ${md(x.x)}</div>
          <div class="r-resp">
            <button class="altavoz" data-pt="${esc(frase)}" onclick="hablar(this.dataset.pt)" aria-label="Escuchar">🔊</button>
            <span>✅ <strong>${esc(x.r)}</strong> → <em>${esc(frase)}</em></span>
          </div>
        </div>`;
      }).join("") : ""}
      ${a.consejos ? `<div class="consejo">💡 <strong>Consejos</strong><ul>${a.consejos.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : ""}
      ${a.porque ? `<div class="porque">🤔 <strong>¿Por qué?</strong> ${md(a.porque)}</div>` : ""}
      ${a.ojo ? `<div class="ojo">⚠️ <strong>Ojo:</strong> ${md(a.ojo)}</div>` : ""}

function htmlCompletar(e, i) {
  const partes = e.frase.split("___");
  let frase = esc(partes[0]);
  for (let k = 1; k < partes.length; k++) {
    const largo = Math.max(...[].concat(e.resp[k - 1]).map(s => s.length));
    frase += `<input class="hueco" style="width:${Math.max(5, largo + 2)}ch" autocomplete="off" autocapitalize="off"
      autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')comprobarCompletar(${i})">` + esc(partes[k]);
  }
  return `
    <div class="ej" id="ej-${i}">
      <div class="tipo">✏️ Completa${e.pista ? ` · <em>${esc(e.pista)}</em>` : ""}</div>
      <div class="frase">${frase}</div>
      ${e.trad ? `<div class="trad">${esc(e.trad)}</div>` : ""}
      <div class="controles izq"><button class="btn peq" onclick="comprobarCompletar(${i})">Comprobar</button></div>
      <div class="res"></div>
    </div>`;
}
function htmlMarcar(e, i) {
  return `
    <div class="ej" id="ej-${i}">
      <div class="tipo">☑️ Marca la correcta</div>
      <div class="frase">${md(e.frase)}</div>
      <div class="opciones">
        ${e.opciones.map((o, k) => `<button class="opcion" onclick="marcar(${i}, ${k})">${esc(o)}</button>`).join("")}
      </div>
      <div class="res"></div>
    </div>`;
}
function fraseCompleta(e) {
  return e.frase.split("___").reduce((acc, parte, k) => acc + [].concat(e.resp[k - 1])[0] + parte);
}
function comprobarCompletar(i) {
  if (ejRes[i] !== null) return;
  const e = leccion.ejercicios[i];
  const caja = document.getElementById("ej-" + i);
  const inputs = [...caja.querySelectorAll("input")];
  const res = caja.querySelector(".res");
  if (inputs.some(inp => !inp.value.trim())) {
    res.innerHTML = `<span class="aviso">Completa todos los espacios primero.</span>`;
    return;
  }
  let todoBien = true, casi = false;
  inputs.forEach((inp, k) => {
    const validas = [].concat(e.resp[k]).map(normalizar);
    const v = normalizar(inp.value);
    const exacta = validas.includes(v);
    const soloTildes = !exacta && validas.some(a => sinTildes(a) === sinTildes(v));
    inp.classList.add(exacta ? "bien" : soloTildes ? "casi" : "mal");
    inp.disabled = true;
    if (!exacta) todoBien = false;
    if (soloTildes) casi = true;
  });
  const correcta = fraseCompleta(e);
  let msg = todoBien ? "✅ ¡Correcto!"
          : casi ? `🟡 ¡Casi! Revisa las tildes: <strong>${esc(correcta)}</strong>`
          : `❌ Respuesta: <strong>${esc(correcta)}</strong>`;
  msg += `<div class="pron">🗣️ ${esc(pron(correcta))}</div>`;
  const explica = e.explica || explicarAuto(e);
  if (explica) msg += `<div class="explica">💡 ${md(explica)}</div>`;
  res.innerHTML = msg;
  caja.querySelector(".controles").remove();
  hablar(correcta.replace(/ · /g, ", "));
  terminarEjercicio(i, todoBien);
}
function marcar(i, k) {
  if (ejRes[i] !== null) return;
  const e = leccion.ejercicios[i];
  const caja = document.getElementById("ej-" + i);
  const ok = k === e.resp;
  caja.querySelectorAll(".opcion").forEach((b, j) => {
    if (j === e.resp) b.classList.add("bien");
    else if (j === k) b.classList.add("mal");
    b.disabled = true;
  });
  const oir = e.oir || sinParentesis(e.frase.includes("___") ? e.frase.replace("___", e.opciones[e.resp]) : null);
  let msg = ok ? "✅ ¡Correcto!" : `❌ La correcta es: <strong>${esc(e.opciones[e.resp])}</strong>`;
  if (oir) msg += `<div class="pron">🗣️ ${esc(pron(oir))}</div>`;
  if (e.explica) msg += `<div class="explica">💡 ${md(e.explica)}</div>`;
  caja.querySelector(".res").innerHTML = msg;
  if (oir) hablar(oir);
  terminarEjercicio(i, ok);
}
function terminarEjercicio(i, ok) {
  ejRes[i] = ok;
  document.getElementById("ejMarcador").innerHTML = textoMarcador();
  if (ejRes.every(r => r !== null)) {
    guardarNota("ej-" + leccion.id, Math.round(ejRes.filter(Boolean).length / ejRes.length * 100));
  }
}
function textoMarcador() {
  const hechos = ejRes.filter(r => r !== null).length;
  const bien = ejRes.filter(r => r === true).length;
  if (hechos === ejRes.length && hechos > 0) {
    const pct = Math.round(bien / hechos * 100);
    return `🎉 ¡Terminaste! ${bien} de ${hechos} correctos (${pct}%)` +
      (pct < 100 ? " · Repasa la teoría y vuelve a intentarlo" : " · Perfeito!");
  }
  return `Respondidos: ${hechos} de ${ejRes.length} · Correctos: ${bien}`;
}

// Quiz
function crearQuiz(items) {
  const elegidos = mezclar(items.slice()).slice(0, Math.min(10, items.length));
  const preguntas = elegidos.map(it => {
    const desdePt = Math.random() < 0.5;
    const campo = desdePt ? "es" : "pt";
    const correcta = it[campo];
    const otras = [...new Set(items.map(x => x[campo]).filter(x => x !== correcta))];
    return {
      it, desdePt, correcta,
      opciones: mezclar([correcta, ...mezclar(otras).slice(0, 3)])
    };
  });
  return { preguntas, i: 0, aciertos: 0, elegida: null };
}
function htmlQuiz() {
  const q = quiz;
  if (q.i >= q.preguntas.length) {
    const pct = Math.round(q.aciertos / q.preguntas.length * 100);
    guardarNota(leccion.id, pct);
    const msg = pct === 100 ? "¡Perfeito! 🎉" : pct >= APROBADO ? "Muito bem! 👏 Lección completada" : "Quase lá… ¡inténtalo otra vez! 💪";
    return `
      <div class="resultado">
        <div class="pct">${pct}%</div>
        <p>${q.aciertos} de ${q.preguntas.length} correctas</p>
        <p><strong>${msg}</strong></p>
        <div class="controles">
          <button class="btn sec" onclick="location.hash='#/'">Lecciones</button>
          <button class="btn" onclick="cambiarPestana('quiz')">Repetir quiz</button>
        </div>
      </div>`;
  }
  const p = q.preguntas[q.i];
  const pregunta = p.desdePt ? p.it.pt : p.it.es;
  const opciones = p.opciones.map((op, k) => {
    let clase = "";
    if (q.elegida !== null) {
      if (op === p.correcta) clase = "bien";
      else if (k === q.elegida) clase = "mal";
    }
    return `<button class="opcion ${clase}" onclick="responder(${k})">${esc(op)}</button>`;
  }).join("");
  return `
    <div class="contador" style="margin:0 0 8px">Pregunta ${q.i + 1} de ${q.preguntas.length} · Aciertos: ${q.aciertos}</div>
    <div class="pregunta">
      <div class="tipo">${p.desdePt ? "¿Qué significa en español?" : "¿Cómo se dice en portugués?"}</div>
      <div class="grande">${esc(pregunta)}</div>
      ${p.desdePt ? `<button class="altavoz" onclick="hablar(quiz.preguntas[quiz.i].it.pt)">🔊</button>` : ""}
    </div>
    <div class="opciones">${opciones}</div>
    ${q.elegida !== null ? `<div class="controles"><button class="btn" onclick="siguiente()">Siguiente →</button></div>` : ""}`;
}
function responder(k) {
  if (quiz.elegida !== null) return;
  const p = quiz.preguntas[quiz.i];
  quiz.elegida = k;
  if (p.opciones[k] === p.correcta) quiz.aciertos++;
  hablar(p.it.pt);
  pintarLeccion();
}
function siguiente() {
  quiz.i++;
  quiz.elegida = null;
  pintarLeccion();
  window.scrollTo(0, 0);
}

function explicarVerbo(e) {

        if (esV) x += ` En español: «${conjugarEs(esV[1], t, p)}».`;

  localStorage.setItem(ERR_CLAVE, JSON.stringify(lista.slice(-80)));
}
function quitarError(clave) { localStorage.setItem(ERR_CLAVE, JSON.stringify(errores().filter(x => x.clave !== clave))); }
let modoEscribir = localStorage.getItem("pt-escribir") === "1";
let statsPr = JSON.parse(localStorage.getItem(STATS_CLAVE) || '{"total":0,"bien":0,"record":0}');
let pr = null;

function abrirPractica(cat) {
  if (!pr || pr.cat !== cat) pr = { cat, sesion: { bien: 0, mal: 0, racha: 0 }, q: null };
  nuevaPregunta();
}
function nuevaPregunta() {
  const gens = CATEGORIAS.find(c => c.id === pr.cat).g;
  let q = null;
  for (let intento = 0; intento < 40 && !q; intento++) {
    q = azar(gens)();
    if (q && pr.q && q.clave === pr.q.clave && intento < 20) q = null;   // no repetir la misma pregunta seguida
  }
  Object.assign(pr, { q, respondida: false, elegida: null, ok: false, casi: false, escrito: "" });
  pintarPractica();
  window.scrollTo(0, 0);
  if (q && q.escucha) hablar(q.escucha);
}
function cambiarModo(escribir) {
  modoEscribir = escribir;
  localStorage.setItem("pt-escribir", escribir ? "1" : "0");
  nuevaPregunta();
}
function responderPractica(k) {
  if (pr.respondida) return;
  pr.elegida = k;
  pr.ok = k === pr.q.resp;
  registrarRespuesta();
}
function comprobarPractica() {
  if (pr.respondida) return;
  const valor = document.getElementById("prInput").value;
  if (!valor.trim()) return;
  const validas = (pr.q.validas || [pr.q.opciones[pr.q.resp]]).map(normalizar);
  const v = normalizar(valor);
  pr.escrito = valor;
  pr.ok = validas.includes(v);
  pr.casi = !pr.ok && validas.some(a => sinTildes(a) === sinTildes(v));
  registrarRespuesta();
}
function registrarRespuesta() {
  const q = pr.q, s = pr.sesion;
  pr.respondida = true;
  statsPr.total++;
  if (pr.ok) {
    s.bien++; s.racha++; statsPr.bien++;
    statsPr.record = Math.max(statsPr.record, s.racha);
    if (pr.cat === "errores" || q.deErrores) quitarError(q.clave);
  } else {
    s.mal++; s.racha = 0;
    guardarError(q);
  }
  localStorage.setItem(STATS_CLAVE, JSON.stringify(statsPr));
  pintarPractica();
  const texto = q.oir || q.escucha;
  if (texto) hablar(texto);
}
function pintarPractica() {
  const q = pr.q, s = pr.sesion;
  const nErr = errores().length;
  const chips = CATEGORIAS.map(c => `<button class="chip ${pr.cat === c.id ? "activa" : ""}" onclick="location.hash='#/practica/${c.id}'">${c.t}${c.id === "errores" ? ` (${nErr})` : ""}</button>`).join("");
  let cuerpo;
  if (!q) {
    cuerpo = `<div class="resultado"><p>${pr.cat === "errores" ? "🎉 ¡No tienes errores pendientes! Practica en otra categoría y aquí aparecerá lo que falles." : "No hay preguntas en esta categoría."}</p></div>`;
  } else {
    const escribir = q.soloEscribir || (modoEscribir && q.escribible);
    const correcta = escribir ? (q.validas || [q.opciones[q.resp]])[0] : q.opciones[q.resp];
    cuerpo = `
      <div class="pregunta">
        ${q.sub ? `<div class="tipo">${md(q.sub)}</div>` : ""}
        ${q.escucha ? `<button class="btn-escuchar" onclick="hablar(pr.q.escucha)" aria-label="Escuchar">🔊</button>` : ""}
        ${q.pregunta ? `<div class="grande">${md(q.pregunta)}</div>` : ""}
      </div>`;
    if (escribir) {
      cuerpo += `
        <div class="escribir">
          <input id="prInput" class="hueco ${pr.respondida ? (pr.ok ? "bien" : pr.casi ? "casi" : "mal") : ""}" value="${esc(pr.escrito)}"
            ${pr.respondida ? "disabled" : ""} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
            placeholder="Escribe aquí..." onkeydown="if(event.key==='Enter')comprobarPractica()">
          ${pr.respondida ? "" : `<button class="btn" onclick="comprobarPractica()">OK</button>`}
        </div>`;
    } else {
      cuerpo += `<div class="opciones">${q.opciones.map((o, k) => {
        const clase = !pr.respondida ? "" : k === q.resp ? "bien" : k === pr.elegida ? "mal" : "";
        return `<button class="opcion ${clase}" ${pr.respondida ? "disabled" : ""} onclick="responderPractica(${k})">${esc(o)}</button>`;
      }).join("")}</div>`;
    }
    if (pr.respondida) {
      const texto = q.oir || q.escucha;
      let msg = pr.ok ? "✅ ¡Correcto!" : pr.casi ? `🟡 ¡Casi! Revisa las tildes: <strong>${esc(correcta)}</strong>` : `❌ Correcta: <strong>${esc(correcta)}</strong>`;
      if (texto) msg += `<div class="frase-oir">${esc(texto)}</div><div class="pron">🗣️ ${esc(pron(texto))}</div>`;
      if (q.traduccion) msg += `<div class="trad">${esc(q.traduccion)}</div>`;
      if (q.explica) msg += `<div class="explica">💡 ${md(q.explica)}</div>`;
      cuerpo += `<div class="res pr-res">${msg}</div>
        <div class="controles"><button class="btn ancho" onclick="nuevaPregunta()">Siguiente →</button></div>`;
    }
  }
  $app.innerHTML = `
    <button class="volver" onclick="location.hash='#/'">← Inicio</button>
    <h2 style="margin:6px 0 0">🚌 Práctica sin fin</h2>
    <div class="chips">${chips}</div>
    <div class="modo">
      <button class="chip ${modoEscribir ? "" : "activa"}" onclick="cambiarModo(false)">👆 Elegir</button>
      <button class="chip ${modoEscribir ? "activa" : ""}" onclick="cambiarModo(true)">✍️ Escribir</button>
    </div>
    <div class="stats"><span>✅ ${s.bien} · ❌ ${s.mal}</span><span>🔥 Racha ${s.racha}</span><span>🏆 ${statsPr.record}</span></div>
    ${cuerpo}`;
}

// ---------- inicio ----------
pintarVelocidad();
pintarTema();
pintarProgreso();
ruta();
</script>
